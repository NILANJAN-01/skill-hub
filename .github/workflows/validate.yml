name: Validate skills

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate skills and marketplace
        run: python tools/validate_skills.py
      - name: Check catalog.json and skills/README.md are up to date
        run: python tools/build_catalog.py --check
      - name: Byte-compile tools and skill scripts
        run: python -m py_compile tools/*.py skills/skillforge/scripts/skillforge.py
