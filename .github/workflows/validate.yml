name: Validate skills

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate skills and marketplace
        run: python tools/validate_skills.py
      - name: Check generated files are up to date
        run: python tools/build_catalog.py --check
      - name: Byte-compile tools and every skill script
        run: python -m compileall -q tools skills mcp-server skill-hub-mcp
      - name: Skill tests (every skill with tests, standard library only)
        shell: bash
        run: |
          set -e
          for d in $(find skills -type d -name scripts | sort); do
            if ls "$d"/test_*.py >/dev/null 2>&1; then
              echo "== $d"
              python -m unittest discover -s "$d" -p "test_*.py" -v
            fi
          done
      - name: Installer tests (standard library only, no network)
        run: python -m unittest discover -s tools -p "test_*.py" -v
      - name: MCP server tests (standard library only, no network)
        run: |
          python -m unittest discover -s mcp-server/tests -v
          python -m unittest discover -s skill-hub-mcp/tests -v
      - name: Skill tests (image-inspector and video-inspector, also checked against Pillow and OpenCV)
        run: |
          command -v ffmpeg >/dev/null || (sudo apt-get update -q && sudo apt-get install -y -q ffmpeg)
          python -m pip install --quiet Pillow opencv-python-headless
          python -m unittest discover -s skills/testing/tools/image-inspector/scripts -p "test_*.py" -v
          python -m unittest discover -s skills/testing/tools/video-inspector/scripts -p "test_*.py" -v

  install:
    # The installer promises Python 3.8+ and every OS; check that it holds.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Installer and skill scripts stay compatible with Python 3.8
        shell: bash
        run: |
          python -m pip install --quiet vermin
          # same files as the "python 3.8 compatibility" step of tools/hub.py check (VERMIN there)
          vermin -q --no-tips --violations -t=3.8- --exclude-regex '(^|[\\/])(test_[^\\/]*\.py|fixtures[\\/].*)$' \
            tools/install.py skills
      - name: Install into every agent's folder
        shell: bash
        run: |
          set -e
          proj="$RUNNER_TEMP/proj"
          python tools/install.py --list > /dev/null
          python tools/install.py --detect
          python tools/install.py --agent claude-code,antigravity,devin,copilot,cursor,windsurf,codex,gemini-cli,universal \
            --plugin hub-tools --skill git-rebasing --project "$proj" --each --yes
          for d in .claude .agents .github .cursor .devin .gemini; do
            test -f "$proj/$d/skills/git-rebasing/SKILL.md" || { echo "missing $d"; exit 1; }
          done
          python tools/install.py --zip "$RUNNER_TEMP/zips" --plugin hub-tools
          test -f "$RUNNER_TEMP/zips/find-skills.zip"
      - name: Guided mode with a sandboxed home
        shell: bash
        run: |
          set -e
          home="$RUNNER_TEMP/home"; mkdir -p "$home/.codex" && touch "$home/.codex/auth.json"
          export HOME="$home" USERPROFILE="$home"
          # Actions runs bash with -eo pipefail: capture output instead of piping into grep -q,
          # which can stop the installer with a broken pipe.
          # menu answers: 1 = set up everything for the detected agents (Codex here), y = go ahead
          printf '1\ny\n' | python tools/install.py
          test -f "$home/.agents/skills/git-rebasing/SKILL.md"
          # a second run must find nothing to change
          out="$(printf '1\n' | python tools/install.py)"
          grep -q "Nothing to change" <<< "$out"
          # declining at the menu writes nothing; exit code 4 means cancelled
          code=0; out="$(printf 'n\n' | python tools/install.py)" || code=$?
          test "$code" -eq 4
          grep -q "Nothing was changed" <<< "$out"
