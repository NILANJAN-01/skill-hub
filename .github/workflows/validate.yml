name: Validate skills

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate skills and marketplace
        run: python tools/validate_skills.py
      - name: Check generated files are up to date
        run: python tools/build_catalog.py --check
      - name: Byte-compile tools and skill scripts
        run: python -m py_compile tools/*.py skills/skillforge/scripts/skillforge.py skills/android-uiautomator-locators/scripts/*.py skills/android-uiautomator-locators/scripts/testing/*.py skills/image-inspector/scripts/*.py skills/video-inspector/scripts/*.py skills/url-to-skill/scripts/*.py
      - name: Skill tests (android-uiautomator-locators)
        run: python -m unittest discover -s skills/android-uiautomator-locators/scripts -p "test_*.py" -v
      - name: Skill tests (image-inspector, standard library only)
        run: python -m unittest discover -s skills/image-inspector/scripts -p "test_*.py" -v
      - name: Skill tests (url-to-skill, local web server)
        run: python -m unittest discover -s skills/url-to-skill/scripts -p "test_*.py" -v
      - name: Skill tests (video-inspector, standard library only)
        run: python -m unittest discover -s skills/video-inspector/scripts -p "test_*.py" -v
      - name: Skill tests (image-inspector and video-inspector, with Pillow and OpenCV)
        run: |
          python -m pip install --quiet Pillow opencv-python-headless
          python -m unittest discover -s skills/image-inspector/scripts -p "test_*.py" -v
          python -m unittest discover -s skills/video-inspector/scripts -p "test_*.py" -v

  install:
    # The installer promises Python 3.8+ and every OS; check that it holds.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Installer stays compatible with Python 3.8
        shell: bash
        run: |
          python -m pip install --quiet vermin
          vermin --no-tips --violations -t=3.8- tools/install.py
      - name: Install into every agent's folder
        shell: bash
        run: |
          set -e
          proj="$RUNNER_TEMP/proj"
          python tools/install.py --list > /dev/null
          python tools/install.py --detect
          python tools/install.py --agent claude-code,antigravity,devin,copilot,cursor,windsurf,codex,gemini-cli,universal \
            --plugin hub-tools --skill git-rebasing --project "$proj" --each --yes
          for d in .claude .agents .github .cursor .devin .gemini; do
            test -f "$proj/$d/skills/git-rebasing/SKILL.md" || { echo "missing $d"; exit 1; }
          done
          python tools/install.py --zip "$RUNNER_TEMP/zips" --plugin hub-tools
          test -f "$RUNNER_TEMP/zips/find-skills.zip"
      - name: Guided mode with a sandboxed home
        shell: bash
        run: |
          set -e
          home="$RUNNER_TEMP/home"; mkdir -p "$home/.codex" && touch "$home/.codex/auth.json"
          export HOME="$home" USERPROFILE="$home"
          # answers: codex only (by key), everything, for me, go ahead
          printf 'codex\na\n1\ny\n' | python tools/install.py
          test -f "$home/.agents/skills/git-rebasing/SKILL.md"
          # second run must find nothing to do and change nothing
          printf 'codex\na\n1\n' | python tools/install.py | grep -q "Nothing to do"
          # declining writes nothing
          printf 'n\n' | python tools/install.py | grep -q "Nothing was changed"
