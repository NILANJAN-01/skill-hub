name: Publish MCP server

# Push a tag like mcp-v0.2.0 (must match mcp-server/pyproject.toml) to publish skillhub-mcp to PyPI.
# One-time setup on PyPI: add a "trusted publisher" for this repo, workflow publish-mcp.yml, environment "pypi".
on:
  push:
    tags: ["mcp-v*"]

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check tag matches package version
        run: |
          v=$(python -c "import tomllib;print(tomllib.load(open('mcp-server/pyproject.toml','rb'))['project']['version'])")
          [ "mcp-v$v" = "$GITHUB_REF_NAME" ] || { echo "Tag $GITHUB_REF_NAME != mcp-v$v"; exit 1; }
      - name: Test
        run: python -m unittest discover -s mcp-server/tests
      - name: Build
        run: |
          python -m pip install --quiet build
          python -m build mcp-server
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: mcp-server/dist
