/* top bar */

aside.toc a.on { color: var(--text); background: var(--accent-soft); border-left-color: var(--accent); font-weight: 600; }

p { margin: 0 0 12px; }
.hr { height: 1px; background: var(--border); margin: 40px 0 0; }

/* hero */
.hero { padding: 40px 0 8px; }
.eyebrow { font: 600 12px Inter, sans-serif; letter-spacing: .08em; text-transform: uppercase; color: var(--accent-ink); margin-bottom: 10px; }
.hero h1 { font-size: clamp(30px, 5vw, 44px); margin: 0 0 12px; }

.stats { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 12px; margin: 24px 0 6px; }
.stat { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 14px 16px; box-shadow: var(--shadow); }
.stat b { display: block; font-size: 26px; line-height: 1.1; font-variant-numeric: tabular-nums; }
.stat span { color: var(--muted); font-size: 13px; }

/* cards and blocks */
.cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 14px; }
.card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 18px; box-shadow: var(--shadow); min-width: 0; }
.card h4 { margin: 0 0 6px; font-size: 15.5px; display: flex; align-items: center; gap: 8px; }
.card p { color: var(--muted); font-size: 14px; margin: 0; }
.card .ic { width: 30px; height: 30px; border-radius: 8px; background: var(--accent-soft); color: var(--accent-ink); display: grid; place-items: center; flex: none; }
.card .ic svg { width: 17px; height: 17px; }
.flow { display: flex; align-items: stretch; gap: 0; flex-wrap: wrap; margin: 6px 0 4px; }
.flow .step { flex: 1 1 180px; background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 14px 16px; min-width: 0; }
.flow .step b { display: block; margin-bottom: 2px; }
.flow .step span { color: var(--muted); font-size: 13.5px; }
.flow .arrow { display: grid; place-items: center; color: var(--muted); padding: 0 6px; font-size: 20px; }
.steps { counter-reset: step; display: grid; gap: 14px; }
.stepcard { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 18px 18px 18px 62px; position: relative; box-shadow: var(--shadow); min-width: 0; }
.stepcard::before { counter-increment: step; content: counter(step); position: absolute; left: 18px; top: 18px; width: 28px; height: 28px; border-radius: 50%; background: var(--accent); color: #fff; font-weight: 700; font-size: 14px; display: grid; place-items: center; }
.stepcard h4 { margin: 2px 0 6px; font-size: 16px; }
.stepcard p { color: var(--muted); margin-bottom: 10px; }
.callout { border: 1px solid var(--border); border-left: 4px solid var(--accent); background: var(--surface); border-radius: 10px; padding: 12px 16px; margin: 14px 0; font-size: 14.5px; }
.callout.ok { border-left-color: var(--ok); }
.callout b:first-child { margin-right: 4px; }

/* code */
.code { position: relative; background: var(--code-bg); border: 1px solid var(--border); border-radius: 10px; margin: 8px 0 12px; }
.code pre { margin: 0; padding: 12px 70px 12px 14px; font-size: 13px; line-height: 1.6; white-space: pre-wrap; overflow-wrap: anywhere; }
.code .cmt { color: var(--muted); }
.copy { position: absolute; top: 7px; right: 7px; border: 1px solid var(--border); background: var(--surface); color: var(--muted); border-radius: 7px; font: 12px Inter, sans-serif; padding: 3px 8px; cursor: pointer; }
.copy:hover { color: var(--text); }
.copy.done { color: var(--ok); border-color: var(--ok); }
.tabs { display: flex; gap: 6px; flex-wrap: wrap; margin: 2px 0 0; }
.tab { border: 1px solid var(--border); background: var(--surface); color: var(--muted); border-radius: 8px; padding: 4px 11px; font: 13px Inter, sans-serif; cursor: pointer; }
.tab.on { background: var(--accent-soft); border-color: var(--accent); color: var(--text); }

/* tables */
.tablewrap { overflow-x: auto; border: 1px solid var(--border); border-radius: var(--radius); background: var(--surface); margin: 8px 0 16px; }
table { border-collapse: collapse; width: 100%; font-size: 14px; }
th, td { text-align: left; vertical-align: top; padding: 10px 14px; border-bottom: 1px solid var(--border); }
th { font-size: 12px; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); background: var(--surface-2); font-weight: 600; white-space: nowrap; }
tr:last-child td { border-bottom: 0; }
td.nowrap { white-space: nowrap; }
td .sub { color: var(--muted); font-size: 13px; }
.badge { display: inline-block; font: 600 11px/1.6 Inter, sans-serif; border-radius: 999px; padding: 0 8px; border: 1px solid var(--border); color: var(--muted); white-space: nowrap; }
.badge.w { color: var(--warn); background: var(--warn-soft); border-color: transparent; }
.badge.r { color: var(--ok); background: var(--ok-soft); border-color: transparent; }
.badge.a { color: var(--accent-ink); background: var(--accent-soft); border-color: transparent; }

/* catalog */
.toolbar { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; margin: 6px 0 12px; }
.search { flex: 1 1 300px; display: flex; align-items: center; gap: 8px; background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 0 12px; }
.search svg { width: 17px; height: 17px; color: var(--muted); flex: none; }
.search input { border: 0; outline: 0; background: transparent; color: var(--text); font: inherit; padding: 10px 0; width: 100%; min-width: 0; }
.search:focus-within { border-color: var(--accent); }
.count { color: var(--muted); font-size: 13px; }
.chips { display: flex; flex-wrap: wrap; gap: 7px; margin-bottom: 18px; }
.chip { border: 1px solid var(--border); background: var(--surface); color: var(--muted); border-radius: 999px; padding: 4px 11px; font: 13px Inter, sans-serif; cursor: pointer; }
.chip:hover { color: var(--text); }
.chip.on { background: var(--accent-soft); border-color: var(--accent); color: var(--text); }
.chip .n { opacity: .7; margin-left: 3px; }
h4.cat { font-size: 15px; margin: 22px 0 10px; display: flex; gap: 8px; align-items: baseline; flex-wrap: wrap; }
h4.cat code { font-weight: 400; color: var(--muted); }
.skills { display: grid; gap: 10px; }
details.skill { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); box-shadow: var(--shadow); min-width: 0; }
details.skill[open] { border-color: var(--border-strong); }
details.skill summary { list-style: none; cursor: pointer; padding: 14px 16px; display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 4px 12px; }
details.skill summary::-webkit-details-marker { display: none; }
details.skill summary .t { font-weight: 600; }
details.skill summary .nm { font: 12px "JetBrains Mono", monospace; color: var(--muted); overflow-wrap: anywhere; }
details.skill summary .d { grid-column: 1 / -1; color: var(--muted); font-size: 13.5px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
details.skill[open] summary .d { display: none; }
details.skill summary .meta { display: flex; gap: 6px; align-items: start; flex-wrap: wrap; justify-content: end; }
.skillbody { padding: 0 16px 16px; border-top: 1px solid var(--border); }
.skillbody h5 { font-size: 12px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin: 16px 0 6px; }
.skillbody p { font-size: 14.5px; }
.skillbody ul.prompts { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; }
.skillbody ul.prompts li { background: var(--surface-2); border-radius: 8px; padding: 7px 11px; font-size: 14px; }
.script { border: 1px solid var(--border); border-radius: 10px; padding: 10px 12px; margin-bottom: 8px; }
.script .h { display: flex; gap: 8px; align-items: baseline; flex-wrap: wrap; font-size: 14px; }
.script .h .s { color: var(--muted); }
.links { display: flex; gap: 14px; flex-wrap: wrap; font-size: 13.5px; margin-top: 12px; }
.empty { color: var(--muted); padding: 18px; text-align: center; border: 1px dashed var(--border); border-radius: var(--radius); }
mark { background: var(--accent-soft); color: inherit; border-radius: 3px; padding: 0 1px; }

/* faq */
details.faq { border: 1px solid var(--border); border-radius: 10px; background: var(--surface); margin-bottom: 8px; }
details.faq summary { cursor: pointer; padding: 12px 16px; font-weight: 600; }
details.faq > div { padding: 0 16px 12px; color: var(--muted); font-size: 14.5px; }
.changes { display: grid; gap: 14px; }
.change h4 { margin: 0 0 8px; font-size: 16px; }
.change ul { margin: 0; padding-left: 20px; font-size: 14.5px; }
.change li { margin-bottom: 6px; }
footer { border-top: 1px solid var(--border); color: var(--muted); font-size: 13px; padding: 22px 16px 40px; text-align: center; }

@media (max-width: 960px) {
  .layout { grid-template-columns: minmax(0, 1fr); gap: 0; }
  aside.toc { display: none; position: fixed; top: 60px; left: 0; right: 0; bottom: 0; max-height: none; background: var(--bg); z-index: 25; padding: 16px; }
  body.tocopen aside.toc { display: block; }
  #tocbtn { display: grid; }
  header.top nav { display: none; }
  .flow .arrow { display: none; }
  .flow { gap: 10px; }

@media (max-width: 560px) {

  details.skill summary { grid-template-columns: minmax(0, 1fr); }
  details.skill summary .meta { justify-content: start; }
  .stepcard { padding-left: 18px; padding-top: 56px; }
}
</style>

<script>
const DATA = /*__DATA__*/null;

/* ---------- helpers ---------- */
const $ = (s, el = document) => el.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"}[c]));
function md(s) {            // tiny, safe inline markdown: `code`, **bold**, [text](url)
  return esc(s)
    .replace(/`([^`]+)`/g, "<code>$1</code>")
    .replace(/\*\*([^*]+)\*\*/g, "<b>$1</b>")
    .replace(/\[([^\]]+)\]\(([^)\s]+)\)/g, (m, t, u) => /^(https?:|[\w./#-]+$)/.test(u) ? `<a href="${u}">${t}</a>` : m);
}
const ICON = {
  skill: '<path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20V3H6.5A2.5 2.5 0 0 0 4 5.5z"/><path d="M8 7h8M8 11h6"/>',
  plugin: '<rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/>',
  agent: '<rect x="4" y="7" width="16" height="12" rx="3"/><path d="M12 3v4M9 12h.01M15 12h.01M9 16h6"/>',
  script: '<path d="m8 9-4 3 4 3M16 9l4 3-4 3M13 6l-2 12"/>',
  mcp: '<circle cx="6" cy="12" r="2.5"/><circle cx="18" cy="6" r="2.5"/><circle cx="18" cy="18" r="2.5"/><path d="M8.3 11 15.7 7M8.3 13l7.4 4"/>',
  router: '<path d="M4 12h6l4-6h6M14 18h6M10 12l4 6"/>',
  plug: '<path d="M9 3v5M15 3v5M6 8h12v3a6 6 0 0 1-12 0zM12 17v4"/>',
};
const ic = k => `<span class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${ICON[k]}</svg></span>`;
function code(text) {
  const body = esc(text).replace(/(^|\n)(\s*#[^\n]*)/g, '$1<span class="cmt">$2</span>');
  return `<div class="code"><button class="copy" type="button">Copy</button><pre>${body}</pre></div>`;
}
function table(head, rows) {
  return `<div class="tablewrap"><table><thead><tr>${head.map(h => `<th>${h}</th>`).join("")}</tr></thead><tbody>${rows.join("")}</tbody></table></div>`;
}
const catTitle = Object.fromEntries(DATA.categories.map(c => [c.name, c.title]));
const S = DATA.stats, H = DATA.hub;

/* ---------- sections ---------- */
const sections = [];
function section(id, title, nav, html, count) { sections.push({id, title, nav: nav || title, html, count}); }

// Overview
section("overview", "", "Overview", `
<div class="hero">
  <div class="eyebrow">User guide · version ${esc(H.version)}</div>
  <h1>Everything in <span>skill-hub</span>, in one place</h1>
  <p>${esc(H.description)}. This guide shows how to install the skills and MCP servers, how to get the most out of them in your AI coding agent, and how to extend the hub. It is generated from the repository, so it always matches what is in it.</p>
  <div class="stats">
    <div class="stat"><b>${S.skills}</b><span>skills</span></div>
    <div class="stat"><b>${S.plugins}</b><span>installable plugins</span></div>
    <div class="stat"><b>${S.agents}</b><span>supported agents</span></div>
    <div class="stat"><b>${S.scripts}</b><span>bundled scripts</span></div>
    <div class="stat"><b>${S.mcp_tools}</b><span>MCP server tools</span></div>
    <div class="stat"><b>${S.prompts}</b><span>example prompts</span></div>
  </div>
</div>
<h3>How it fits together</h3>
<div class="flow">
  <div class="step"><b>You ask</b><span>in plain words, in your agent</span></div><div class="arrow">→</div>
  <div class="step"><b>The agent picks a skill</b><span>from its description, or via the skill-hub MCP server</span></div><div class="arrow">→</div>
  <div class="step"><b>The skill guides the work</b><span>steps, safety rules, troubleshooting</span></div><div class="arrow">→</div>
  <div class="step"><b>Scripts do the heavy lifting</b><span>audits, reports, generators: Python, no installs</span></div>
</div>`);

// Quick start
const QS = {
  "macOS / Linux": `# One command: every skill + the skill-hub MCP server, for every agent it finds
curl -fsSL ${H.repository.replace("github.com", "raw.githubusercontent.com")}/main/tools/install.py | python3 - --setup`,
  "Windows (PowerShell)": `irm ${H.repository.replace("github.com", "raw.githubusercontent.com")}/main/tools/install.py -OutFile install.py
python install.py --setup`,
  "From a clone": `git clone ${H.repository}.git
cd skill-hub
python tools/install.py --setup`,

function renderSkills() {

function openSkill(name) {
  if (activeCat || query) { activeCat = ""; query = ""; $("#q").value = $("#gq").value = ""; document.querySelectorAll("#chips .chip").forEach((c, i) => c.classList.toggle("on", i === 0)); renderSkills(); filterRows(); }
  const d = document.getElementById("skill-" + name);
  if (d) { d.open = true; d.scrollIntoView({block: "start"}); }
}

  const a = e.target.closest("a[data-open]");
  if (a) { e.preventDefault(); openSkill(a.dataset.open); history.replaceState(null, "", "#skill-" + a.dataset.open); }
  const c = e.target.closest(".copy");
  if (c) {
    const text = c.nextElementSibling.textContent;
    const done = () => { c.textContent = "Copied"; c.classList.add("done"); setTimeout(() => { c.textContent = "Copy"; c.classList.remove("done"); }, 1400); };
    if (navigator.clipboard && window.isSecureContext) navigator.clipboard.writeText(text).then(done, done);
    else { const t = document.createElement("textarea"); t.value = text; document.body.appendChild(t); t.select(); try { document.execCommand("copy"); } catch (_) {} t.remove(); done(); }
  }
  const tab = e.target.closest(".tab");
  if (tab) {
    const group = tab.parentElement;
    group.querySelectorAll(".tab").forEach(t => t.classList.toggle("on", t === tab));
    document.querySelector(`[data-panel="${group.dataset.tabs}"]`).innerHTML = code(QS[tab.dataset.k]);
  }
  if (e.target.closest("#toc a")) document.body.classList.remove("tocopen");
});

$("#theme").addEventListener("click", () => {
  const dark = document.documentElement.getAttribute("data-theme") === "dark" ||
    (!document.documentElement.getAttribute("data-theme") && matchMedia("(prefers-color-scheme: dark)").matches);
  const next = dark ? "light" : "dark";
  applyTheme(next);
  try { localStorage.setItem("skillhub-theme", next); } catch (_) {}
});
</script>
</body>
</html>
