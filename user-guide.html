scope is 'project'","enum":[],"required":false}],"writes":false},{"name":"plan_change","title":"Plan an install, update or removal","description":"Work out exactly which folders would change to install, update or remove a skill or plugin. Changes nothing. Returns the steps, an equivalent command, and a token for apply_change when writes are enabled.","params":[{"name":"action","type":"string","description":"","enum":["install","update","remove"],"required":true},{"name":"target","type":"string","description":"Skill or plugin names, separated by commas","enum":[],"required":true},{"name":"agents","type":"string","description":"Agent ids separated by commas (see list_catalog kind=agents), or 'detected' (default) for every agent found on this machine","enum":[],"required":false},{"name":"scope","type":"string","description":"'user' = every project of this user (default); 'project' = one project folder","enum":["user","project"],"required":false},{"name":"project","type":"string","description":"Absolute path of the project folder; needed when scope is 'project'","enum":[],"required":false}],"writes":false},{"name":"apply_change","title":"Apply a planned change","description":"Carry out a plan made by plan_change. Writes or deletes skill folders. Call it only after the user has seen that plan and agreed.","params":[{"name":"token","type":"string","description":"The token returned by plan_change","enum":[],"required":true}],"writes":true}],"prompts":[{"name":"find_skill","title":"Find a skill for a task","description":"Route the task to skills and follow the best match."},{"name":"use_skill","title":"Use a named skill","description":"Load one skill and apply it."}],"resources":["skillhub://catalog","skillhub://skill/{name}"]},"mcp_presets":[{"name":"filesystem","command":"npx -y @modelcontextprotocol/server-filesystem","description":"Read, write and search files in the folders you allow","env":[],"needs_args":"the folders it may read and write (--mcp-arg <folder>, repeatable)","docs":"https://github.com/modelcontextprotocol/servers/tree/main/src/filesystem"},{"name":"memory","command":"npx -y @modelcontextprotocol/server-memory","description":"Persistent knowledge-graph memory across sessions","env":[],"needs_args":"","docs":"https://github.com/modelcontextprotocol/servers/tree/main/src/memory"},{"name":"sequential-thinking","command":"npx -y @modelcontextprotocol/server-sequential-thinking","description":"Step-by-step problem solving with revisable thoughts","env":[],"needs_args":"","docs":"https://github.com/modelcontextprotocol/servers/tree/main/src/sequentialthinking"},{"name":"fetch","command":"uvx mcp-server-fetch","description":"Fetch web pages and convert them to markdown","env":[],"needs_args":"","docs":"https://github.com/modelcontextprotocol/servers/tree/main/src/fetch"},{"name":"git","command":"uvx mcp-server-git","description":"Read, search and change local git repositories","env":[],"needs_args":"","docs":"https://github.com/modelcontextprotocol/servers/tree/main/src/git"},{"name":"time","command":"uvx mcp-server-time","description":"Current time and time-zone conversion","env":[],"needs_args":"","docs":"https://github.com/modelcontextprotocol/servers/tree/main/src/time"},{"name":"playwright","command":"npx -y @playwright/mcp@latest","description":"Drive a browser: open pages, click, fill forms, take snapshots","env":[],"needs_args":"","docs":"https://github.com/microsoft/playwright-mcp"},{"name":"github","command":"docker run -i --rm -e GITHUB_PERSONAL_ACCESS_TOKEN ghcr.io/github/github-mcp-server","description":"GitHub issues, pull requests, code search and repos (needs Docker and a token)","env":["GITHUB_PERSONAL_ACCESS_TOKEN"],"needs_args":"","docs":"https://github.com/github/github-mcp-server"},{"name":"everything","command":"npx -y @modelcontextprotocol/server-everything","description":"Reference server exposing every MCP feature, for testing clients","env":[],"needs_args":"","docs":"https://github.com/modelcontextprotocol/servers/tree/main/src/everything"}],"tools":[{"file":"install.py","path":"tools/install.py","summary":"Set up skill-hub for the AI coding agents / IDEs on this machine: skills and the skill-hub MCP server.","usage":[]},{"file":"build_catalog.py","path":"tools/build_catalog.py","summary":"Build catalog.json and skills/README.md from every skills/<area>/<group>/<name>/SKILL.md and the plugin marketplace.","usage":[]},{"file":"validate_skills.py","path":"tools/validate_skills.py","summary":"Validate every skill in skills/ against the Agent Skills spec and the hub conventions.","usage":[]}],"maintainers":{"rules":[{"title":"01. Never hand-edit generated files","path":"rule/01-generated-files.md","summary":"Change the sources, then run `python tools/build_catalog.py`."},{"title":"02. Sources of truth","path":"rule/02-sources-of-truth.md","summary":""},{"title":"03. Skill content","path":"rule/03-skill-content.md","summary":"1. Skills must be **agent-neutral**. Do not name one agent's tools, slash commands or config files in a skill body."},{"title":"04. Checks before finishing any change","path":"rule/04-checks.md","summary":"Run this and fix every failure:"},{"title":"05. Tooling","path":"rule/05-tooling.md","summary":"1. Tooling is **Python standard library only**. Do not add dependencies to `tools/`."},{"title":"06. Pull requests","path":"rule/06-pull-requests.md","summary":"1. One skill per pull request."},{"title":"07. Common tasks","path":"rule/07-common-tasks.md","summary":""},{"title":"08. Releases","path":"rule/08-releases.md","summary":"1. The version is `metadata.version` in `.claude-plugin/marketplace.json`."}],"checks":["python tools/hub.py check            # or --changed while iterating","python tools/build_catalog.py","python tools/validate_skills.py","python tools/build_catalog.py --check","python -m compileall -q tools skills mcp-server skill-hub-mcp","python -m unittest discover -s mcp-server/tests -v","python -m unittest discover -s skill-hub-mcp/tests -v","python -m unittest discover -s tools -p \"test_*.py\" -v","python -m unittest discover -s skills/<area>/<group>/<name>/scripts -p \"test_*.py\" -v"],"tasks":[{"task":"Add a skill","steps":"`python tools/hub.py new-skill <area>/<group>/<name> --plugin <plugin>` (registers it and adds prompts), replace the TODOs and the template text, then `python tools/hub.py check --changed`"},{"task":"Add a category","steps":"`hub.py new-skill ... --plugin <new> --plugin-title \"Title\" --plugin-description \"...\"` for its first skill, or by hand: a plugin entry in `marketplace.json` and a title in `CATEGORY_TITLES`"},{"task":"Support a new agent","steps":"Add an entry to `AGENTS` in `tools/install.py` from official docs (`project`, `global`, `also_reads`, `global_also_reads`, and `detect`), rebuild, check with `python tools/install.py --detect`"},{"task":"Generate skills from a PDF","steps":"Follow `skills/generic/hub/skillforge/SKILL.md`"},{"task":"Add a group","steps":"Create the folder `skills/<area>/<group>/`; nothing to register"},{"task":"Add an area","steps":"Add it to `AREAS` in `tools/hublib.py`, create `skills/<area>/` (with a `README.md` if empty), rebuild"},{"task":"Move a skill","steps":"`git mv` its folder, update its path in `marketplace.json`, rebuild and validate"},{"task":"Change user-facing install steps","steps":"Edit `GUIDE.md` and the README Install section"},{"task":"Browse the catalog locally","steps":"`python -m http.server`, open http://localhost:8000"}]},"changelog":[{"title":"Unreleased","items":["Skills with scripts no longer need any Python package (`pip install`): each now runs on the Python 3.8+ standard library, and tests run with site-packages disabled (`python -S`). Where a job truly needs a codec or a model, the script calls a standalone program instead of a package. - `rest-api-testing`: YAML OpenAPI specs (and YAML suites) are read by the bundled `yaml_lite.py` instead of PyYAML. It matched PyYAML exactly on 163 real files, including GitHub's 11 MB and Stripe's 6.6 MB specs, and is about 2.5x faster than PyYAML's C loader. - `skillforge`: `pdf_lite.py` replaces PyMuPDF and `nlp_lite.py` replaces scikit-learn, numpy and yake; `requirements.txt` is gone. On *Pro Git* the plan is identical (the same 60 skills from the same 383 sections) and the run takes 12 s instead of 31 s. TF-IDF and PageRank match scikit-learn and numpy to 6 decimals. It also fixes words being glued together when a PDF draws spaces in their own font, skips text hidden by clipping paths, and keeps ligatures and spaces that PyMuPDF dropped. `--engine pymupdf` still uses PyMuPDF when it is installed. - `image-inspector`: pure-Python JPEG (baseline and progressive), GIF, TIFF, PNM and EXIF decoders whose pixels are bit-exact with Pillow (verified with fixture hashes). `--find`, `--compare` and sharpness no longer need OpenCV: scores use OpenCV's formulas, and a phone screenshot search takes 1-2 s. OCR calls the Tesseract program directly instead of pytesseract. Pillow is still used, when installed, for speed and for WebP/HEIF; ffmpeg can decode those too. - `video-inspector`: frames are decoded by the ffmpeg program and analysed in pure Python with OpenCV's HSV, histogram, Bhattacharyya, gray and Laplacian formulas. On a 720p test video the scenes, black and frozen sections and tracked colours match the OpenCV version, in half the time. OpenCV is used only when ffmpeg is missing. Frame sharpness is now measured at 320 px (was 512 px), so its values are lower than before. - `yt-lecture-overview`: the audio stage decodes with the ffmpeg program when PyAV is missing, the loudness analysis is pure Python (no numpy), slides can be captured with ffmpeg, and a new `whisper-cpp` engine turns speech into text with the whisper.cpp program, so the whole pipeline can run without pip. - CI installs ffmpeg for the video tests; Pillow and OpenCV stay only for tests that compare results against them.","Installer (internal): the MCP server entry, the `skill-dispatcher` hook and the `token-optimizer` hooks are planned, shown and written by one `ConfigEntry` module in `tools/install.py`, with an adapter per entry, instead of three copies of the same code. Visible effects: the plan and apply lines use the same wording for all three; removing a hook no longer needs its skill folder to exist; re-adding a hook also cleans up a copy left under a different event; and the `token-optimizer` hooks say \"add\" or \"update\" instead of \"set\". `tools/hub.py setup-hooks` merges its hooks with the installer's code.","Installer: the guided menu (`python install.py` with no options) now covers install, update and remove for single skills and for MCP servers. New choices: **Install or update skills you choose** (everything, plugins, only the installed skills with an update, or single skills found by a word in their name; each is marked `[x]` installed, `[!]` update available or `[ ]` not installed), **Update or remove installed skills** (pick from what is installed, then update or remove; removing `skill-dispatcher`, `skill-router` or `token-optimizer` also removes their hooks), and **Add or remove MCP servers** (the skill-hub server, every preset and the servers already configured, each with how many agents have it; presets that need folders ask for them). It asks \"Where?\" before the skills, so their states match the folders it will change, and asks again after an unknown menu number. An update never installs new copies; it only replaces copies that differ from the hub.","Docs: `CLAUDE.md` is a thin pointer to `AGENTS.md`; commands and architecture moved to `ARCHITECTURE.md`, read on demand, and the skill-router rule moved to `AGENTS.md`.","Updated: `lint-checker`. - **Security (Windows):** file names containing characters `cmd.exe` acts on (`& | < > ^ % ! \" ( )`) are no longer passed to `.cmd`/`.bat` tools such as npm's `node_modules/.bin` shims, where a name like `a&calc&.md` could run a command. They are listed as not linted, and the run reports INCOMPLETE (exit 3). - **Fewer false languages and alarms:** Gradle's `*.gradle.kts` build scripts no longer make a Java project count as Kotlin. `.vue`, `.svelte` and `.astro` components count as JavaScript, so ESLint or Biome runs on them. The `mixed-indent` check ignores the bodies of block comments and Python docstrings. - **Faster:** build files are scanned once per run instead of five times. - The description mentions coding standards and static analysis, and a `compatibility` field states the requirements.","Installer: a professional finish for `--setup`, `--uninstall` and the rest. - **Clear source and exit codes.** The first line says which version is installed and where from (local clone, a checksum-verified release, or `main`, which is not verified). Every run ends with a summary, and items left to do by hand (a config file it could not parse) are listed as \"need your attention\". Exit codes are 0 done, 1 error, 2 bad options, 3 partly done, 4 cancelled (in `--help`). - **Shorter output.** One line per folder instead of one per skill, so a setup prints about 25 lines instead of 270; `--verbose` lists every skill. New `--version`. - **Readable errors.** A failed download (404, offline, proxy, TLS certificate) prints one actionable message instead of a Python traceback. A mistyped agent, plugin or skill suggests the closest name (\"Did you mean claude-code?\") without the full usage text. - **Nothing left behind.** A download run deletes its temp copy of the hub, which was left in the temp folder before. `--uninstall` deletes the `.skillhub-backup` files once a file is back to its original content (and lists any it keeps), and deletes config files that setup created when they end up empty. Merged JSON files keep their indentation. - **License note.** The plan says when it includes the 61 non-commercial (CC BY-NC-SA 3.0) `git-*` skills and how to choose plugins instead. - The summary says which Python runs the MCP server, so an upgrade that breaks it is easy to fix (`--setup` again). - The skill-hub MCP server also installs the skills a skill requires, and shows installer messages for exit code 2.","Docs and `install.bat`: the one-line install commands use the installer from the latest release (it installs that release and verifies its checksum); `main` is documented as the latest development version. `install.bat` downloads the release installer unless `SKILLHUB_REF` is set and enables TLS 1.2 for older Windows PowerShell.","Tooling: distribution checks. `template/SKILL.md` is now `template/SKILL.md.tmpl`, because `npx skills` installed it as a placeholder skill named `template-skill`; `hub.py new-skill` renames it in the copy, and `validate_skills.py` rejects any `SKILL.md` outside `skills/<area>/<group>/<name>/`. New `metadata.requires` frontmatter field: `install.py` also installs the skills a skill needs (announced as `+ <name> (needed by ...)`; `--remove` leaves them in place), and the validator checks that they exist and that every plugin listing the skill lists them too. CI and `hub.py check` (when `vermin` is installed) check every skill script, not only `install.py`, for Python 3.8 compatibility. A test keeps the skill folder lists in `skill-router` and `skill-orchestrator` equal to `AGENTS` in `install.py`. The template is agent-neutral.","Fixed: `gradle-android`: `gradle_doctor.py fix --apply` and `add-lib --apply` crashed on Python 3.8 and 3.9 (`Path.write_text(newline=)` is 3.10+).","Updated: `skill-dispatcher` declares `requires: skill-router`; `adb-connect`, `adb-debug` and `adb-device-control` declare `requires: adb-tool`, so installing one of them on its own also installs the skill it runs.","Updated: `lint-checker` and `robotframework-libraries` mark their guarded Python 3.11 / 3.9 lines for `vermin`; `skillforge` points to `template/SKILL.md.tmpl`.","Tooling: hooks in `tools/hub.py`. `hook post-edit` rebuilds the generated files after an edit to any of their sources, and is silent unless the build fails or a generated file was edited by hand. `hook stop` runs `check --changed` when an agent is about to finish and, if it fails, blocks once per failing state with the short report (at most 3 times a session; states that passed are not rechecked). `hook pre-commit` verifies without writing. `setup-hooks` installs the git pre-commit hook (never replacing a foreign one) and merges the agent hooks into `.claude/settings.json`, keeping other settings; it is a dry run unless `--yes`, and `--remove` undoes it. `HUB_HOOKS=off` disables all of them.","Updated: `contribute-skill` uses `hub.py new-skill` and `hub.py check --changed`, keeps the manual steps for older checkouts, and covers the new placeholder errors.","Tooling: `tools/hub.py`, one command per repository chore with short output. `check` rebuilds the generated files and then runs everything CI runs in parallel (about 14 s instead of about 60 s one after another), printing one line per step group, the output of failed steps only and the command to rerun each; `--changed [REF]` runs only the tests affected by changes. `new-skill` copies `template/`, writes the frontmatter, registers the skill in `marketplace.json` (also creating a new plugin and its `CATEGORY_TITLES` entry) and `examples/prompts.json`, and rebuilds. `validate_skills.py` now rejects leftover `TODO:` placeholders and template text.","Added: `lint-checker` (new `code-quality-tools` category): lint a project in any language. `lint_check.py` detects languages and the configured or installed linters (ruff, ESLint, Biome, golangci-lint, clippy, RuboCop, ShellCheck and more), runs them in one report with a dry-run-first `--fix`, lints only changed files with `--changed`, and has built-in checks that need no tools (conflict markers, Python/JSON/TOML syntax, leftover debug code, whitespace). Java and Kotlin are linted through the Gradle or Maven build's Checkstyle, PMD, SpotBugs, ktlint, kotlinter, detekt, Spotless and Android Lint tasks, run with the project's wrapper.","Added: software design skill set (new `software-design-tools` category, `skills/development/software-design`), based on the ideas in *A Philosophy of Software Design* (John Ousterhout) and written in original words: `software-design-guardrails` (always-on design rules; `install_guardrails.py` writes them into a project's agent instruction files, copies the checker into the project and adds a pre-commit hook, as a dry run unless `--yes`; `design_check.py` flags red flags such as pass-through methods and variables, shallow one-use functions, overexposed parameter lists, swallowed and repeated error handlers, duplicated code, comments that repeat code, missing or contaminated interface comments, vague names, generic containers and kludge markers, for Python via `ast` and for C-family languages heuristically, on whole trees or only changed lines (`--diff`, `--staged`), with baselines, inline ignores and JSON output), `deep-modules` (interfaces, information hiding, layers, splitting and merging), `error-handling-design` (define errors out of existence, mask, aggregate, crash), `obvious-code` (comments, names, consistency) and `design-it-twice` (compare designs before coding; `design_note.py` scaffolds and checks the design note; strategic programming; performance).","Added: context management skill set (new `context-management-tools` category): `context-handoff` (when to checkpoint, compact or restart a long agent session; `handoff.py draft` pre-fills a handoff note from git state and `check` flags missing sections, phrases that rely on lost history, relative dates, missing files and secrets in notes and sub-agent briefs), `context-memory` (durable one-fact-per-file agent memory with an index; `memory_lint.py` lints a memory folder for unindexed or dead entries, duplicates, missing reasons, stale file references, relative dates and secrets, and builds the index), `context-window-budget` (context budgets for LLM apps and agent loops; `context_budget.py` plans a window, analyses where a transcript's tokens go and trims it by truncating or clearing old tool results and dropping whole old turns without splitting tool-call pairs). The bundle also includes `context-engineering`.","Added: `rest-api-testing` (new `api-testing-tools` category): REST API testing for web applications in any field. It plans cases from an OpenAPI spec (`api_check.py plan`), lints suites for typos, literal secrets, order bugs and unsafe retries (`lint`), and runs JSON suites (`run`) with variables and chaining, cookies, schema/contract checks, retries only for idempotent requests, polling instead of sleeps, `allowed_hosts`, `--read-only`, masked secrets and JUnit/Markdown/JSON reports. References cover test design and the OWASP API Top 10, REST Assured, pytest, Postman/Newman, Karate, Playwright and SuperTest, and checklists for banking, healthcare, e-commerce, insurance, telecom, travel, logistics, government, SaaS and media.","Added: JUnit skill set (new `junit-tools` category, Java and Kotlin, JUnit 6.1.3): `junit-test-authoring` (setup check and a test-class generator for Java and Kotlin sources), `junit-migration` (audit for JUnit 3/4/5 code, removed JUnit 6 APIs, tests that never run and weak tests, with migration guides), `junit-run-reports` (Gradle/Maven/ConsoleLauncher commands and a summary of JUnit XML and Open Test Reporting results with causes, flaky and slow tests). The bundle also includes `kotlin-unit-test`.","Added: UI Automator skill set (new `uiautomator-tools` category, Kotlin and Java, androidx.test.uiautomator 2.4.1): `uiautomator-test-authoring` (setup check and generator for tests, page objects, Macrobenchmarks and Baseline Profile generators), `uiautomator-migration` (audit of legacy and flaky code with a migration map), `uiautomator-run-debug` (runs tests with Gradle or `am instrument` and explains failures from raw output or JUnit XML). The bundle also includes `android-uiautomator-locators`.","Added: `user-guide.html`, the master user guide: quick start, concepts, the full skill catalog with scripts and example prompts, installer reference, supported agents, MCP server tools and presets, maintainer tasks and this changelog. It is generated by `tools/build_catalog.py` from the skills, `install.py`, the MCP server and the rules, so it updates with every change (and `--check` fails if it is stale).","Added: Robot Framework skill set (new `robotframework-tools` category, up to RF 7.5): `robotframework-test-authoring`, `robotframework-libraries`, `robotframework-results`, `robotframework-ci`, each with a script; result-analysis fixtures were produced by Robot Framework 7.5.1.","Added: Playwright skill set (new `playwright-tools` category, up to Playwright 1.65): `playwright-test-authoring`, `playwright-debugging`, `playwright-ci`, `playwright-mcp-browser`, `playwright-upgrade`, each with a script except the MCP browser skill.","Added: AI agent skill set (new `ai-agent-tools` category): `mcp-server-builder`, `agent-tool-design`, `llm-evals`, `rag-pipeline`, each with a script.","Installer: `--setup` installs every skill and registers the skill-hub MCP server for every detected agent in one command; `--doctor` checks skills and MCP setup per agent; `--uninstall` removes everything it set up. The MCP server runs from a hub copy in `~/.skill-hub/hub`.","Installer: `--add-mcp`, `--remove-mcp`, `--list-mcp`, `--mcp-command`, `--mcp-arg`, `--mcp-env` and `--mcp-test` manage any MCP server across all agents (presets for filesystem, memory, fetch, git, time, playwright, github and more). Config files are merged, only the named entry changes, and the first edit keeps a `.skillhub-backup`.","Installer: per-agent MCP config locations (JSON and Codex TOML) in `AGENTS`, from vendor docs; options are grouped in `--help`.","`skill-router`: routing hints for the new skills."]},{"title":"1.3.0 - 2026-11-16","items":["Changed: skills moved from `skills/<name>/` to `skills/<area>/<group>/<name>/`, with five areas (`testing`, `development`, `design`, `generic`, `external-tools`) and group subfolders. Skill names, plugin names and install commands are unchanged. `catalog.json` gains `area` and `group` per skill and an `areas` list, and each skill's `path` is its new folder. The installer, validator, catalog builder, both MCP servers, `skill-router` and `skill-orchestrator` find skills at the new depth; the installer still reads older flat releases. The validator rejects skills outside the layout and duplicate names.","Added: `skill-hub-mcp/`, a new MCP server kept beside `mcp-server/`. It searches (BM25), routes multi-part requests to skills, reads playbooks, detects agents, lists installed skills, and plans installs, updates and removals. With `--allow-install` it can apply a plan the user agreed to, through a one-time token; without it the server is read-only.","`skill-router`: word forms now share a stem, so \"rebase\" finds `git-rebasing`; routing hints added for `git-rebasing`, `git-rewriting-history`, `git-undoing-things` and `git-stashing-and-cleaning`.","`template/`: added `references/details.md`, so the link in the template's `SKILL.md` resolves.","Added: `context-engineering` (in `ai-efficiency-tools`): one central context file, thin pointers for each tool, layered loading, a token budget and handoff notes, with a script that finds duplicated or drifting instruction files and creates the pointers.","Added: `ai-token-saver` (new `ai-efficiency-tools` category): audits a project for context waste and lists habits that cut token use and cost.","Added: `adb-tool`, `adb-connect`, `adb-device-control`, `adb-debug` (new `adb-tools` category).","Added: `gradle-android` (new `gradle-tools` category).","Added: `install.bat`, a one-shot Windows installer with precondition checks. It now honours `SKILLHUB_REF` instead of always reading `main`.","Installer: update detection compares every file of a skill, not only `SKILL.md`, so a change to a bundled script or reference is now reported and `--update` refreshes it. Line endings are ignored.","Installer: records what it installs in `.skill-hub.json` in each skills folder (skill, hub version, repository); new `--installed` lists the hub skills an agent has, their version and whether they still match the hub.","Installer: a release download (`--ref v1.3.0`, or the new `SKILLHUB_REF`) uses the release archive and checks it against the release's `SHA256SUMS`; a mismatch stops the install.","Installer: unit tests in `tools/test_install.py`, run by CI and the release workflow.","Docs: the `--plugin` table in `GUIDE.md` is generated from the marketplace (it listed 14 of 22 plugins); update, remove and pinning steps corrected; marketplace description is agent-neutral.","MCP server: removed the `uvx skillhub-mcp` instruction. That PyPI name belongs to an unrelated project; this server has not been published.","Repo: rules moved into `rule/`; `code-reviewer` agent for skill review.","Added: `skill-router` (in `hub-tools`): front door for any request. Splits it into parts, grades each basic or advanced, checks the basics are given (file, link, device, tools), and picks the installed skills to load, with editable routing hints and a hand-off to `skill-orchestrator` for multi-skill jobs.","`skill-orchestrator`: hand-off briefings for inter-skill communication. `run done` records `--fact key=value` and `--question` beside the note and outputs, and the new `run handoff DIR [N]` prints one briefing of everything earlier steps passed on."]},{"title":"1.2.0 - 2026-11-14","items":["Added: `python-tutor` (new `learning-tools` category): explains any `.py` file from beginner to advanced and generates self-contained study-notes HTML (walkthrough, ~75 concepts by level, gotchas, interview Q&A, fundamentals checklist). The file is parsed, never run.","`python-tutor`: Functionality section (call tree, inputs, outputs, side effects, public API, docstring examples), `--only` to explain selected functions or classes, loose mode for Python 2 files and syntax errors, warnings about suspicious explanations, and notes that follow moved code."]},{"title":"1.1.0 - 2026-11-14","items":["Added: `repo-architecture` (in `repo-tools`): scans a repository and drafts `ARCHITECTURE.md` (Mermaid) and a self-contained `architecture.html` (layered SVG), then guides the reader to describe components and flows.","Added: `powershell-commands` (new `shell-tools` category): PowerShell playbook for agents with a bash-to-PowerShell map and references for files, text and data, processes, network, dev tools, scripting and troubleshooting."]}]};

/* ---------- helpers ---------- */
const $ = (s, el = document) => el.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"}[c]));
function md(s) {            // tiny, safe inline markdown: `code`, **bold**, [text](url)
  return esc(s)
    .replace(/`([^`]+)`/g, "<code>$1</code>")
    .replace(/\*\*([^*]+)\*\*/g, "<b>$1</b>")
    .replace(/\[([^\]]+)\]\(([^)\s]+)\)/g, (m, t, u) => /^(https?:|[\w./#-]+$)/.test(u) ? `<a href="${u}">${t}</a>` : m);
}
const ICON = {
  skill: '<path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20V3H6.5A2.5 2.5 0 0 0 4 5.5z"/><path d="M8 7h8M8 11h6"/>',
  plugin: '<rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/>',
  agent: '<rect x="4" y="7" width="16" height="12" rx="3"/><path d="M12 3v4M9 12h.01M15 12h.01M9 16h6"/>',
  script: '<path d="m8 9-4 3 4 3M16 9l4 3-4 3M13 6l-2 12"/>',
  mcp: '<circle cx="6" cy="12" r="2.5"/><circle cx="18" cy="6" r="2.5"/><circle cx="18" cy="18" r="2.5"/><path d="M8.3 11 15.7 7M8.3 13l7.4 4"/>',
  router: '<path d="M4 12h6l4-6h6M14 18h6M10 12l4 6"/>',
  plug: '<path d="M9 3v5M15 3v5M6 8h12v3a6 6 0 0 1-12 0zM12 17v4"/>',
};
const ic = k => `<span class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${ICON[k]}</svg></span>`;
function code(text) {
  const body = esc(text).replace(/(^|\n)(\s*#[^\n]*)/g, '$1<span class="cmt">$2</span>');
  return `<div class="code"><button class="copy" type="button">Copy</button><pre>${body}</pre></div>`;
}
function table(head, rows) {
  return `<div class="tablewrap"><table><thead><tr>${head.map(h => `<th>${h}</th>`).join("")}</tr></thead><tbody>${rows.join("")}</tbody></table></div>`;
}
const catTitle = Object.fromEntries(DATA.categories.map(c => [c.name, c.title]));
const S = DATA.stats, H = DATA.hub;

/* ---------- sections ---------- */
const sections = [];
function section(id, title, nav, html, count) { sections.push({id, title, nav: nav || title, html, count}); }

// Overview
section("overview", "", "Overview", `
<div class="hero">
  <div class="eyebrow">User guide · version ${esc(H.version)}</div>
  <h1>Everything in <span>skill-hub</span>, in one place</h1>
  <p>${esc(H.description)}. This guide shows how to install the skills and MCP servers, how to get the most out of them in your AI coding agent, and how to extend the hub. It is generated from the repository, so it always matches what is in it.</p>
  <div class="stats">
    <div class="stat"><b>${S.skills}</b><span>skills</span></div>
    <div class="stat"><b>${S.plugins}</b><span>installable plugins</span></div>
    <div class="stat"><b>${S.agents}</b><span>supported agents</span></div>
    <div class="stat"><b>${S.scripts}</b><span>bundled scripts</span></div>
    <div class="stat"><b>${S.mcp_tools}</b><span>MCP server tools</span></div>
    <div class="stat"><b>${S.prompts}</b><span>example prompts</span></div>
  </div>
</div>
<h3>How it fits together</h3>
<div class="flow">
  <div class="step"><b>You ask</b><span>in plain words, in your agent</span></div><div class="arrow">→</div>
  <div class="step"><b>The agent picks a skill</b><span>from its description, or via the skill-hub MCP server</span></div><div class="arrow">→</div>
  <div class="step"><b>The skill guides the work</b><span>steps, safety rules, troubleshooting</span></div><div class="arrow">→</div>
  <div class="step"><b>Scripts do the heavy lifting</b><span>audits, reports, generators: Python, no installs</span></div>
</div>`);

// Quick start
const QS = {
  "macOS / Linux": `# One command: every skill + the skill-hub MCP server, for every agent it finds
curl -fsSL ${H.repository.replace("github.com", "raw.githubusercontent.com")}/main/tools/install.py | python3 - --setup`,
  "Windows (PowerShell)": `irm ${H.repository.replace("github.com", "raw.githubusercontent.com")}/main/tools/install.py -OutFile install.py
python install.py --setup`,
  "From a clone": `git clone ${H.repository}.git
cd skill-hub
python tools/install.py --setup`,
};
section("quick-start", "Quick start", null, `
<p class="lead">Three steps. Python 3.8+ is the only requirement; nothing is written until you confirm the plan.</p>
<div class="steps">
  <div class="stepcard"><h4>Install skills and the MCP server</h4><p>The installer detects your agents, shows the plan and asks once.</p>
    <div class="tabs" data-tabs="qs">${Object.keys(QS).map((k, i) => `<button class="tab${i ? "" : " on"}" type="button" data-k="${esc(k)}">${esc(k)}</button>`).join("")}</div>
    <div data-panel="qs">${code(QS[Object.keys(QS)[0]])}</div></div>
  <div class="stepcard"><h4>Restart your agents</h4><p>Agents read skills and MCP servers at start-up. Then check everything is in place:</p>${code("python install.py --doctor")}</div>
  <div class="stepcard"><h4>Just ask</h4><p>Describe the task; the agent loads the matching skill. Examples: “Write Playwright tests for our login page”, “Migrate our JUnit 4 tests to JUnit 6”, “Write a UI Automator test in Kotlin that signs in”, “Write API tests for our orders endpoints from openapi.json”, “Our Robot run failed, here is output.xml”, “This session is getting long: write a handoff note so we can restart”, “Make every AI agent in this repo follow good software design rules”, “adb says unauthorized, fix the connection to my phone”, “Audit this repo for token waste”. For results you can ship, see <a href="#professional">Professional use</a>.</p></div>
</div>
<div class="callout ok"><b>Prefer to choose?</b> Run the installer with no options for a menu: everything, install or update chosen skills, update or remove installed skills, add or remove MCP servers, doctor, or remove everything. Narrow <code>--setup</code> with <code>--agent</code>, <code>--plugin</code>, <code>--skill</code> or <code>--project</code>.</div>`);

section("professional", "Professional use", null, `
<p class="lead">Skills give the agent a tested playbook. To get results you can review, merge and ship, give it a clear brief, let the scripts produce evidence and check the work like a colleague's.</p>
<h3>Write a brief, not a wish</h3>
<p>A professional request has five parts. Leave out the ones that are obvious, but never the goal or how you will know it is done.</p>
${table(["Part", "What to include", "Example"], [
  ["Goal", "One outcome, in your own words", "E2E tests for the login page"],
  ["Context", "Where the code or artefacts are, versions, environment", "<code>apps/web</code>, Playwright 1.65, TypeScript, test users in <code>.env.test</code>"],
  ["Constraints", "What must not change, the rules to follow", "role-based locators only, no sleeps, don't touch app code"],
  ["Done when", "A check that proves it, ideally a command", "tests pass three runs in a row and <code>pw_audit.py</code> reports no issues"],
  ["Output", "What you want back", "the spec files, plus what is covered and what is not"],
].map(r => `<tr><td class="nowrap"><b>${r[0]}</b></td><td>${r[1]}</td><td>${r[2]}</td></tr>`))}
<div class="compare">
  <div class="card"><h4>Vague <span class="badge w">guesswork</span></h4><p>“<i>write tests for login</i>”</p></div>
  <div class="card"><h4>Professional <span class="badge r">reviewable</span></h4><p>“<i>Use playwright-test-authoring. Write E2E tests for the login page in apps/web (Playwright 1.65, TypeScript; test users are in .env.test). Use role-based locators only, no sleeps, and don't change app code. Done when the tests pass three runs in a row and pw_audit.py reports no issues. Give me the spec files and a short note on what is not covered.</i>”</p></div>
</div>
<h3>A dependable workflow</h3>
<div class="flow">
  <div class="step"><b>Scope</b><span>one outcome per request; split big work into steps</span></div><div class="arrow">→</div>
  <div class="step"><b>Route</b><span>name the skill, or let <code>skill-router</code> pick and <code>skill-orchestrator</code> chain</span></div><div class="arrow">→</div>
  <div class="step"><b>Execute</b><span>let the skill's scripts do exact work: audits, reports, generators</span></div><div class="arrow">→</div>
  <div class="step"><b>Verify</b><span>tests and checker output, a diff you have read</span></div><div class="arrow">→</div>
  <div class="step"><b>Record</b><span>commit, handoff note or memory for the next session</span></div>
</div>
<h3>Playbooks by role</h3>
<p>Where to start for common jobs. Open a skill for its scripts and more prompts.</p>
${table(["Role", "Skills to install", "A request that works well"], ROLES.map(([role, names, ask]) => `<tr><td class="nowrap"><b>${esc(role)}</b></td><td>${skillLinks(names)}</td><td>“<i>${esc(ask)}</i>”</td></tr>`))}
<h3>Set up a team</h3>
<p>Treat skills like code: choose them on purpose, commit them to the repository, pin a release and review changes to them in pull requests.</p>
${code(`# 1. Install only the categories the team uses, into the repository (preview first)
python install.py --agent detected --plugin playwright-tools --project . --dry-run
python install.py --agent detected --plugin playwright-tools --project .
# 2. Pin a release so every machine gets the same skills (applies when not run from a clone)
python install.py --setup --ref v${H.version}
# 3. Make every agent follow the same design rules, with a pre-commit check (dry run; add --yes to write)
python skills/development/software-design/software-design-guardrails/scripts/install_guardrails.py install --project . --hook
# 4. After an upgrade, check each machine and refresh skills that changed
python install.py --doctor
python install.py --installed
python install.py --setup --update`)}
<div class="callout"><b>Project or user level?</b> Use <code>--project .</code> for skills the whole team must share, so they are versioned with the code. Keep personal helpers (token tools, learning skills) user-level with <code>--global</code>.</div>
<h3>Quality and safety checklist</h3>
<ul class="checklist">
  <li><b>Preview before you write.</b> <code>--dry-run</code> on the installer, guardrails without <code>--yes</code>, <code>api_check.py run --read-only</code> against shared environments.</li>
  <li><b>Ask for evidence.</b> Have the agent run the tests or the skill's script and show the output, rather than say the work is done.</li>
  <li><b>Review like a pull request.</b> Read the diff, and ask what was left out or assumed.</li>
  <li><b>Keep secrets out.</b> Not in prompts, handoff notes or committed suites. <code>--mcp-env NAME</code> copies a secret from your environment; <code>handoff.py check</code> flags secrets in notes.</li>
  <li><b>Grant write access on purpose.</b> The skill-hub MCP server is read-only unless you add <code>--mcp-allow-install</code>, and each install still needs a plan you approve.</li>
  <li><b>Read a script before running it on sensitive data.</b> Every one is short, standard-library Python.</li>
  <li><b>Respect licences.</b> Skills derived from books carry a <code>license</code> field; see <a href="THIRD_PARTY_NOTICES.md">THIRD_PARTY_NOTICES.md</a>.</li>
</ul>
<h3>Keep cost and context under control</h3>
<p>Every installed skill's description is read when the agent starts, and long sessions get slower and less accurate. A few habits keep both in check:</p>
${code(`python skills/generic/ai-efficiency/skill-token-meter/scripts/token_meter.py scan     # what each installed skill costs
python skills/generic/ai-efficiency/ai-token-saver/scripts/token_audit.py .           # context waste in this repository
python skills/generic/ai-efficiency/token-optimizer/scripts/token_optimizer.py auto big.log   # a short version of a big file
python skills/generic/context-management/context-handoff/scripts/handoff.py draft --goal "finish the API tests"   # restart cleanly`)}`);

/* ---------- render page ---------- */
$("#main").innerHTML = sections.map(s => `<section class="doc" id="${s.id}">${s.title ? `<h2>${esc(s.title)}</h2>` : ""}${s.html}</section>`).join('<div class="hr"></div>');
$("#toc").innerHTML = `<div class="label">On this page</div>` + sections.map(s => `<a href="#${s.id}" data-id="${s.id}">${esc(s.nav)}${s.count ? `<span class="n">${s.count}</span>` : ""}</a>`).join("");
$("#ver").textContent = "v" + H.version;
$("#repo").href = H.repository;
$("#foot").innerHTML = `Generated from the repository by <code>tools/build_catalog.py</code> · skill-hub ${esc(H.version)} · <a href="${esc(H.repository)}">${esc(H.repository.replace("https://", ""))}</a>`;

/* ---------- skill catalog ---------- */
let activeCat = "", query = "", view = "category";
const areaTitle = Object.fromEntries(DATA.areas.map(a => [a.name, a.title]));
const skillText = s => [s.name, s.title, s.description, s.needs, catTitle[s.category], ...s.examples, ...s.scripts.map(x => x.file + " " + x.summary)].join(" ").toLowerCase();
DATA.skills.forEach(s => s._t = skillText(s));
const counts = {};
DATA.skills.forEach(s => counts[s.category] = (counts[s.category] || 0) + 1);
$("#chips").innerHTML = `<button class="chip on" data-cat="">All<span class="n">${S.skills}</span></button>` +
  DATA.categories.map(c => `<button class="chip" data-cat="${esc(c.name)}">${esc(c.title)}<span class="n">${counts[c.name] || 0}</span></button>`).join("");
function hl(text) {
  const e = esc(text);
  if (!query) return e;
  const q = query.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
  return e.replace(new RegExp(`(${esc(q)})`, "gi"), "<mark>$1</mark>");
}
function skillCard(s) {
  const plugin = s.plugins[0] || s.category;
  return `<details class="skill" id="skill-${esc(s.name)}"><summary>
<div><div class="t">${hl(s.title)}</div><div class="nm">${hl(s.name)}</div></div>
<div class="meta">${s.scripts.length ? `<span class="badge">${s.scripts.length} script${s.scripts.length > 1 ? "s" : ""}</span>` : ""}<span class="badge a">${esc(catTitle[s.category] || s.category)}</span></div>
<div class="d">${hl(s.description)}</div></summary>
<div class="skillbody">
<h5>What it does</h5><p>${hl(s.description)}</p>
${s.needs ? `<h5>Needs</h5><p>${esc(s.needs)}</p>` : ""}
<h5>Install</h5>${code(`python install.py --setup --skill ${s.name}\npython install.py --agent detected --plugin ${plugin} --global   # the whole category`)}
${s.scripts.length ? `<h5>Scripts</h5>${s.scripts.map(sc => `<div class="script"><div class="h"><a href="${esc(sc.path)}"><code>${esc(sc.file)}</code></a><span class="s">${esc(sc.summary)}</span></div>${sc.usage.length ? code(sc.usage.map(u => u.replace(/^python\s+/, "python " + sc.path.replace(/[^/]+$/, ""))).join("\n")) : ""}</div>`).join("")}` : ""}
${s.examples.length ? `<h5>Try saying</h5><ul class="prompts">${s.examples.map(e => `<li>“${hl(e)}”</li>`).join("")}</ul>` : ""}
<div class="links"><a href="${esc(s.path)}/SKILL.md">Read SKILL.md</a><a href="${esc(s.path)}/">Skill folder</a><span class="sub" style="color:var(--muted)">plugin <code>${esc(plugin)}</code> · area <code>${esc(areaTitle[s.area] || s.area)} / ${esc(s.group)}</code></span></div>
</div></details>`;
}
function renderSkills() {
  const q = query.toLowerCase();
  const list = DATA.skills.filter(s => (!activeCat || s.category === activeCat) && (!q || s._t.includes(q)));
  $("#qcount").textContent = `${list.length} of ${S.skills} skills`;
  if (!list.length) { $("#skilllist").innerHTML = `<div class="empty">No skill matches “${esc(query)}”. Try fewer words, or ask your agent: the skill-router matches by meaning.</div>`; return; }
  const out = [];
  if (view === "list") {
    const rows = [...list].sort((a, b) => a.name.localeCompare(b.name)).map(s => `<tr>
<td class="nowrap"><a href="#skill-${esc(s.name)}" data-open="${esc(s.name)}"><code>${hl(s.name)}</code></a></td>
<td>${hl(s.description)}</td>
<td class="nowrap"><code>${esc(s.plugins[0] || s.category)}</code><div class="sub">${esc(areaTitle[s.area] || s.area)} / ${esc(s.group)}</div></td>
<td class="nowrap">${s.scripts.length || '<span class="sub">-</span>'}</td></tr>`);
    out.push(table(["Skill", "What it does", "Plugin / area", "Scripts"], rows));
  } else if (view === "area") {
    DATA.areas.forEach(a => {
      const groups = a.groups.map(g => [g, list.filter(s => s.area === a.name && s.group === g)]).filter(([, items]) => items.length);
      if (groups.length) out.push(`<h4 class="cat">${esc(a.title)} <code>skills/${esc(a.name)}/</code></h4>` +
        groups.map(([g, items]) => `<h5 class="grp">${esc(g)}/ · ${items.length}</h5><div class="skills">${items.map(skillCard).join("")}</div>`).join(""));
    });
  } else {
    DATA.categories.forEach(c => {
      const items = list.filter(s => s.category === c.name);
      if (items.length) out.push(`<h4 class="cat">${esc(c.title)} <code>--plugin ${esc(c.name)}</code></h4><div class="skills">${items.map(skillCard).join("")}</div>`);
    });
  }
  $("#skilllist").innerHTML = out.join("");
  if (q && list.length <= 3) document.querySelectorAll("#skilllist details.skill").forEach(d => d.open = true);
}
function setView(v) {
  view = v;
  document.querySelectorAll("#views .chip").forEach(c => c.classList.toggle("on", c.dataset.view === v));
  renderSkills();
}
renderSkills();
$("#views").addEventListener("click", e => { const b = e.target.closest(".chip"); if (b) setView(b.dataset.view); });
$("#chips").addEventListener("click", e => {
  const b = e.target.closest(".chip"); if (!b) return;
  activeCat = b.dataset.cat;
  document.querySelectorAll("#chips .chip").forEach(c => c.classList.toggle("on", c === b));
  renderSkills();
});
function filterRows() {
  const q = query.toLowerCase();
  document.querySelectorAll("tr[data-search]").forEach(tr => tr.style.display = !q || tr.dataset.search.includes(q) ? "" : "none");
}
function setQuery(v, from) {
  query = v.trim();
  if (from !== "q") $("#q").value = v;
  if (from !== "gq") $("#gq").value = v;
  renderSkills(); filterRows();
}
$("#q").addEventListener("input", e => setQuery(e.target.value, "q"));
$("#gq").addEventListener("input", e => setQuery(e.target.value, "gq"));
$("#gq").addEventListener("keydown", e => { if (e.key === "Enter") document.getElementById("skills").scrollIntoView(); });
document.addEventListener("keydown", e => {
  if (e.key === "/" && !/input|textarea/i.test(document.activeElement.tagName)) { e.preventDefault(); ($("#gq").offsetParent ? $("#gq") : $("#q")).focus(); }
});

/* ---------- open a skill from links and the URL ---------- */
function openSkill(name) {
  if (activeCat || query) { activeCat = ""; query = ""; $("#q").value = $("#gq").value = ""; document.querySelectorAll("#chips .chip").forEach((c, i) => c.classList.toggle("on", i === 0)); renderSkills(); filterRows(); }
  if (view === "list") setView("category");
  const d = document.getElementById("skill-" + name);
  if (d) { d.open = true; d.scrollIntoView({block: "start"}); }
}
document.addEventListener("click", e => {
  const a = e.target.closest("a[data-open]");
  if (a) { e.preventDefault(); openSkill(a.dataset.open); history.replaceState(null, "", "#skill-" + a.dataset.open); }
  const c = e.target.closest(".copy");
  if (c) {
    const text = c.nextElementSibling.textContent;
    const done = () => { c.textContent = "Copied"; c.classList.add("done"); setTimeout(() => { c.textContent = "Copy"; c.classList.remove("done"); }, 1400); };
    if (navigator.clipboard && window.isSecureContext) navigator.clipboard.writeText(text).then(done, done);
    else { const t = document.createElement("textarea"); t.value = text; document.body.appendChild(t); t.select(); try { document.execCommand("copy"); } catch (_) {} t.remove(); done(); }
  }
  const tab = e.target.closest(".tab");
  if (tab) {
    const group = tab.parentElement;
    group.querySelectorAll(".tab").forEach(t => t.classList.toggle("on", t === tab));
    document.querySelector(`[data-panel="${group.dataset.tabs}"]`).innerHTML = code(QS[tab.dataset.k]);
  }
  if (e.target.closest("#toc a")) document.body.classList.remove("tocopen");
});
if (location.hash.startsWith("#skill-")) setTimeout(() => openSkill(location.hash.slice(7)), 0);

/* ---------- table of contents: scroll spy, mobile toggle ---------- */
const tocLinks = [...document.querySelectorAll("#toc a")];
const spy = new IntersectionObserver(entries => {
  entries.forEach(en => { if (en.isIntersecting) tocLinks.forEach(a => a.classList.toggle("on", a.dataset.id === en.target.id)); });
}, {rootMargin: "-80px 0px -70% 0px"});
document.querySelectorAll("section.doc").forEach(s => spy.observe(s));
$("#tocbtn").addEventListener("click", () => document.body.classList.toggle("tocopen"));

/* ---------- theme ---------- */
function applyTheme(t) { if (t) document.documentElement.setAttribute("data-theme", t); else document.documentElement.removeAttribute("data-theme"); }
try { applyTheme(localStorage.getItem("skillhub-theme")); } catch (_) {}
$("#theme").addEventListener("click", () => {
  const dark = document.documentElement.getAttribute("data-theme") === "dark" ||
    (!document.documentElement.getAttribute("data-theme") && matchMedia("(prefers-color-scheme: dark)").matches);
  const next = dark ? "light" : "dark";
  applyTheme(next);
  try { localStorage.setItem("skillhub-theme", next); } catch (_) {}
});
</script>
</body>
</html>
