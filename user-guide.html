.logo svg { width: 18px; height: 18px; }

.gsearch { flex: 1 1 auto; max-width: 440px; margin-left: auto; display: flex; align-items: center; gap: 8px; background: var(--surface-2); border: 1px solid var(--border); border-radius: 10px; padding: 0 10px; }
.gsearch svg { width: 17px; height: 17px; color: var(--muted); flex: none; }
.gsearch input { border: 0; outline: 0; background: transparent; color: var(--text); font: inherit; font-size: 14px; padding: 8px 0; width: 100%; min-width: 0; }
.gsearch:focus-within { border-color: var(--accent); }
header.top nav { display: flex; gap: 16px; font-size: 14px; }
header.top nav a { color: var(--muted); white-space: nowrap; }
header.top nav a:hover { color: var(--text); text-decoration: none; }
.iconbtn { border: 1px solid var(--border); background: var(--surface); color: var(--muted); width: 36px; height: 36px; border-radius: 9px; display: grid; place-items: center; cursor: pointer; flex: none; }
.iconbtn:hover { color: var(--text); border-color: var(--border-strong); }
.iconbtn svg { width: 18px; height: 18px; }
#tocbtn { display: none; }

/* layout */
.layout { max-width: 1320px; margin: 0 auto; padding: 0 16px; display: grid; grid-template-columns: 236px minmax(0, 1fr); gap: 40px; }
aside.toc { position: sticky; top: 76px; align-self: start; max-height: calc(100vh - 92px); overflow: auto; padding: 22px 0 30px; font-size: 14px; }
aside.toc .label { font: 600 11px Inter, sans-serif; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); margin: 0 0 8px 10px; }
aside.toc a { display: block; color: var(--muted); padding: 5px 10px; border-radius: 7px; border-left: 2px solid transparent; }
aside.toc a:hover { color: var(--text); text-decoration: none; background: var(--surface-2); }
aside.toc a.on { color: var(--text); background: var(--accent-soft); border-left-color: var(--accent); font-weight: 600; }

main { min-width: 0; padding: 8px 0 80px; }
section.doc { padding-top: 34px; }
section.doc > h2 { font-size: 26px; margin: 0 0 6px; }
section.doc > .lead { color: var(--muted); margin: 0 0 20px; max-width: 760px; }
h3 { font-size: 18px; margin: 28px 0 10px; }
p { margin: 0 0 12px; }
.hr { height: 1px; background: var(--border); margin: 40px 0 0; }

/* hero */
.hero { padding: 40px 0 8px; }
.eyebrow { font: 600 12px Inter, sans-serif; letter-spacing: .08em; text-transform: uppercase; color: var(--accent-ink); margin-bottom: 10px; }
.hero h1 { font-size: clamp(30px, 5vw, 44px); margin: 0 0 12px; }
.hero h1 span { color: var(--accent); }
.hero p { color: var(--muted); font-size: 17px; max-width: 780px; }
.stats { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 12px; margin: 24px 0 6px; }
.stat { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 14px 16px; box-shadow: var(--shadow); }
.stat b { display: block; font-size: 26px; line-height: 1.1; font-variant-numeric: tabular-nums; }
.stat span { color: var(--muted); font-size: 13px; }

/* cards and blocks */
.cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 14px; }
.card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 18px; box-shadow: var(--shadow); min-width: 0; }
.card h4 { margin: 0 0 6px; font-size: 15.5px; display: flex; align-items: center; gap: 8px; }
.card p { color: var(--muted); font-size: 14px; margin: 0; }
.card .ic { width: 30px; height: 30px; border-radius: 8px; background: var(--accent-soft); color: var(--accent-ink); display: grid; place-items: center; flex: none; }
.card .ic svg { width: 17px; height: 17px; }
.flow { display: flex; align-items: stretch; gap: 0; flex-wrap: wrap; margin: 6px 0 4px; }
.flow .step { flex: 1 1 180px; background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 14px 16px; min-width: 0; }
.flow .step b { display: block; margin-bottom: 2px; }
.flow .step span { color: var(--muted); font-size: 13.5px; }
.flow .arrow { display: grid; place-items: center; color: var(--muted); padding: 0 6px; font-size: 20px; }
.steps { counter-reset: step; display: grid; gap: 14px; }
.stepcard { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 18px 18px 18px 62px; position: relative; box-shadow: var(--shadow); min-width: 0; }
.stepcard::before { counter-increment: step; content: counter(step); position: absolute; left: 18px; top: 18px; width: 28px; height: 28px; border-radius: 50%; background: var(--accent); color: #fff; font-weight: 700; font-size: 14px; display: grid; place-items: center; }
.stepcard h4 { margin: 2px 0 6px; font-size: 16px; }
.stepcard p { color: var(--muted); margin-bottom: 10px; }
.callout { border: 1px solid var(--border); border-left: 4px solid var(--accent); background: var(--surface); border-radius: 10px; padding: 12px 16px; margin: 14px 0; font-size: 14.5px; }
.callout.ok { border-left-color: var(--ok); }
.callout b:first-child { margin-right: 4px; }

.code { position: relative; background: var(--code-bg); border: 1px solid var(--border); border-radius: 10px; margin: 8px 0 12px; }
.code pre { margin: 0; padding: 12px 70px 12px 14px; font-size: 13px; line-height: 1.6; white-space: pre-wrap; overflow-wrap: anywhere; }
.code .cmt { color: var(--muted); }
.copy { position: absolute; top: 7px; right: 7px; border: 1px solid var(--border); background: var(--surface); color: var(--muted); border-radius: 7px; font: 12px Inter, sans-serif; padding: 3px 8px; cursor: pointer; }
.copy:hover { color: var(--text); }
.copy.done { color: var(--ok); border-color: var(--ok); }
.tabs { display: flex; gap: 6px; flex-wrap: wrap; margin: 2px 0 0; }
.tab { border: 1px solid var(--border); background: var(--surface); color: var(--muted); border-radius: 8px; padding: 4px 11px; font: 13px Inter, sans-serif; cursor: pointer; }
.tab.on { background: var(--accent-soft); border-color: var(--accent); color: var(--text); }

/* tables */
.tablewrap { overflow-x: auto; border: 1px solid var(--border); border-radius: var(--radius); background: var(--surface); margin: 8px 0 16px; }
table { border-collapse: collapse; width: 100%; font-size: 14px; }
th, td { text-align: left; vertical-align: top; padding: 10px 14px; border-bottom: 1px solid var(--border); }
th { font-size: 12px; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); background: var(--surface-2); font-weight: 600; white-space: nowrap; }
tr:last-child td { border-bottom: 0; }
td.nowrap { white-space: nowrap; }
td .sub { color: var(--muted); font-size: 13px; }
.badge { display: inline-block; font: 600 11px/1.6 Inter, sans-serif; border-radius: 999px; padding: 0 8px; border: 1px solid var(--border); color: var(--muted); white-space: nowrap; }
.badge.w { color: var(--warn); background: var(--warn-soft); border-color: transparent; }
.badge.r { color: var(--ok); background: var(--ok-soft); border-color: transparent; }
.badge.a { color: var(--accent-ink); background: var(--accent-soft); border-color: transparent; }

/* catalog */
.toolbar { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; margin: 6px 0 12px; }

.checklist { margin: 0; padding-left: 20px; font-size: 14.5px; }

.empty { color: var(--muted); padding: 18px; text-align: center; border: 1px dashed var(--border); border-radius: var(--radius); }

.changes { display: grid; gap: 14px; }
.change h4 { margin: 0 0 8px; font-size: 16px; }
.change ul { margin: 0; padding-left: 20px; font-size: 14.5px; }
.change li { margin-bottom: 6px; }
footer { border-top: 1px solid var(--border); color: var(--muted); font-size: 13px; padding: 22px 16px 40px; text-align: center; }

@media (max-width: 960px) {

  body.tocopen aside.toc { display: block; }
  #tocbtn { display: grid; }
  header.top nav { display: none; }
  .flow .arrow { display: none; }
  .flow { gap: 10px; }
}
@media (max-width: 560px) {
  .gsearch { display: none; }
  .ver { display: none; }

  details.skill summary .meta { justify-content: start; }
  .stepcard { padding-left: 18px; padding-top: 56px; }
}

are estimates (characters / 4).","path":"skills/generic/context-management/context-handoff","examples":["This session is getting long and you keep retrying the same fix. Write a handoff note so we can restart cleanly.","I'm stopping for today. Save where we are so tomorrow's session can pick up exactly here.","Resume the task from .handoff/2026-11-18-export.md and check the state still matches before continuing.","Write a short brief for a sub-agent to find why GET /reports is slow, read-only, with a 10-line answer."],"scripts":[{"file":"handoff.py","path":"skills/generic/context-management/context-handoff/scripts/handoff.py","summary":"Draft and check session handoff notes and sub-task briefs for AI agents.","usage":["python handoff.py draft [--root DIR] [--goal TEXT] [--out FILE]","python handoff.py check NOTE.md [--kind handoff|brief] [--root DIR] [--max-tokens N] [--json]"]}]},{"name":"context-memory","title":"Context memory: durable, small and correct agent memory","category":"context-management-tools","plugins":["context-management-tools"],"area":"generic","group":"context-management","description":"Give an AI agent memory that lasts across sessions: decide what is worth remembering, store one fact per Markdown file with a short index, update instead of duplicating, and prune stale or wrong memories. A bundled script lints a memory folder (missing index entries, duplicates, secrets, relative dates, files that no longer exist) and builds the index. Use when the user says remember this, asks the agent to stop forgetting preferences, or wants to set up, audit or clean agent memory.","needs":"Needs Python 3.8+ (standard library only) for the script. The format works with any agent that can read and write files; agents with a built-in memory feature can follow the same rules.","path":"skills/generic/context-management/context-memory","examples":["Remember that I never want summaries at the end of your replies.","Set up a memory folder for this project so you stop forgetting our conventions between sessions.","Audit my agent memory folder: find duplicates, stale facts and anything that should not be stored."],"scripts":[{"file":"memory_lint.py","path":"skills/generic/context-management/context-memory/scripts/memory_lint.py","summary":"Lint and index a folder of AI agent memory files (one fact per Markdown file).","usage":["python memory_lint.py lint  <memory-dir> [--index MEMORY.md] [--root PROJECT] [--json]","python memory_lint.py index <memory-dir> [--index MEMORY.md] [--write]","python memory_lint.py new   <memory-dir> --name SLUG --type TYPE --description TEXT [--write]"]}]},{"name":"context-window-budget","title":"Context window budget: fit LLM conversations into the window","category":"context-management-tools","plugins":["context-management-tools"],"area":"generic","group":"context-management","description":"Manage the context window of an LLM app or agent loop you are building: split the window into budgets (system, tools, retrieval, history, output), see where a transcript's tokens go, and trim it to fit by truncating or clearing old tool results and dropping whole old turns without breaking tool-call pairs. Covers summaries, caching-friendly order and overflow errors. Use when a chatbot or agent hits context length errors, gets slow or costly as conversations grow, or needs a history strategy.","needs":"Needs Python 3.8+ (standard library only) for the script. Provider-neutral; reads role/content transcripts with content blocks or tool_calls. Token counts are estimates (characters / 4, images ~1600); use the provider's token counter for exact numbers.","path":"skills/generic/context-management/context-window-budget","examples":["Our support chatbot fails with 'context length exceeded' after long conversations. Add a history strategy.","Here is a transcript of our agent loop as JSON. Where are the tokens going and how do we cut them?","Plan the context budget for a 200k window with a 3k system prompt, 6k of tools and 20k of retrieved docs.","Trim this conversation to 100k tokens without breaking tool call and tool result pairs."],"scripts":[{"file":"context_budget.py","path":"skills/generic/context-management/context-window-budget/scripts/context_budget.py","summary":"Analyse, budget and trim the context window of an LLM conversation.","usage":["python context_budget.py analyze <transcript.json|.jsonl> [--window N] [--keep-last N] [--top N] [--json]","python context_budget.py trim    <transcript.json|.jsonl> --budget N [--keep-last N] [--tool-max N]","[--strategies truncate-tools,clear-tools,drop-oldest] [--summary TEXT]","[--out FILE]","python context_budget.py plan    --window N [--system N] [--tools N] [--output N] [--retrieval N]","[--margin 0.1] [--json]"]}]},{"name":"contribute-skill","title":"Contribute a skill to the hub","category":"hub-tools","plugins":["hub-tools"],"area":"generic","group":"hub","description":"Add or update a skill in the skill-hub repository so that it validates, appears in the catalog and installs into every supported agent. Use when the user wants to write, add, publish, register or rename a skill in skill-hub, create a plugin bundle, or fix errors from validate_skills.py, build_catalog.py or hub.py check.","needs":"Works in any agent. Edits a skill-hub checkout, so it needs file-system and shell access with Python 3.8+. Mentions agent names only to explain where skills are installed.","path":"skills/generic/hub/contribute-skill","examples":["Add a new skill called docker-compose-basics to skill-hub.","validate_skills.py says my skill is 'not listed in any plugin'. How do I fix it?","Create a new plugin category in skill-hub for Kubernetes skills."],"scripts":[]},{"name":"deep-modules","title":"Deep modules: interfaces, information hiding, layers","category":"software-design-tools","plugins":["software-design-tools"],"area":"development","group":"software-design","description":"Design deep modules, classes, functions and APIs: simple interfaces that hide a lot. Covers information hiding and leakage, temporal decomposition, general vs special-purpose code, pass-through methods and variables, defaults vs config knobs, and when to split or merge. Use when designing or refactoring a class, module, service or API, or when code is over-abstracted, tangled or full of tiny wrappers.","needs":"","path":"skills/development/software-design/deep-modules","examples":["Design the interface for a payment client class; keep it simple for callers.","This service has a dozen tiny wrapper classes that just forward calls. Refactor it.","Should I split this 200-line function into smaller ones?","Our reader, transformer and writer classes all know the file format. How should this be structured?"],"scripts":[]},{"name":"design-it-twice","title":"Design it twice: plan, comment first, stay strategic","category":"software-design-tools","plugins":["software-design-tools"],"area":"development","group":"software-design","description":"Plan code before writing it: compare two or more genuinely different designs, write the interface comments first, then implement. Also covers strategic vs tactical programming, keeping the design clean while changing existing code, and designing for performance (measure first, critical path). A script scaffolds and checks the design note. Use when about to build a new module, class, API or feature, or when tempted to patch around a design problem.","needs":"Needs Python 3.8+ (standard library only) for scripts/design_note.py. Works with any agent and language.","path":"skills/development/software-design/design-it-twice","examples":["Before you write the caching layer, compare a couple of designs and pick one.","Plan the API for our notification service first, then implement it.","I'm about to add another flag to work around this bug. Is there a better design?","This endpoint is slow; how should I approach optimising it without making the code worse?"],"scripts":[{"file":"design_note.py","path":"skills/development/software-design/design-it-twice/scripts/design_note.py","summary":"Scaffold and check a \"design it twice\" note before writing a module.","usage":["python design_note.py new \"<title>\" [--alternatives N] [--out FILE]","python design_note.py check FILE [--json]"]}]},{"name":"error-handling-design","title":"Error handling design: define errors out of existence","category":"software-design-tools","plugins":["software-design-tools"],"area":"development","group":"software-design","description":"Design error handling that adds little complexity: define errors out of existence, mask them low, aggregate them into one handler, crash on the unrecoverable, and remove special cases, without hiding errors callers need. Use when writing try/catch, error returns, validation or edge cases, when exception handling spreads through the code, or when an API throws or returns errors too often.","needs":"","path":"skills/development/software-design/error-handling-design","examples":["There are try/except blocks everywhere in this module. Simplify the error handling.","Should delete() throw if the record does not exist?","Review the error handling in this Go package; some errors are being ignored."],"scripts":[]},{"name":"find-skills","title":"Find & install hub skills","category":"hub-tools","plugins":["hub-tools"],"area":"generic","group":"hub","description":"Search the skill-hub catalog for a skill that fits the task and install it into the agent in use. Use when the user asks \"is there a skill for X\", wants to find, browse, list or install skills, or asks what skill-hub offers.","needs":"Works in any agent. Installing writes into the agent's skills folder (needs file-system access and Python 3.8+, or Node for npx); reading the online catalog needs web access.","path":"skills/generic/hub/find-skills","examples":["Is there a skill in skill-hub for git submodules? Which plugin has it?","What skills does skill-hub offer for working with Git remotes?","Find me a skill that helps ugins":["git-collaboration","git-skills"],"area":"development","group":"git-collaboration","description":"Maintain a GitHub repo: collaborators, merging pull requests, notifications, README. Use when administering a GitHub project.","needs":"","path":"skills/development/git-collaboration/git-github-maintaining-a-project","examples":["Check out a GitHub pull request locally to test it.","Add collaborators to my GitHub repository.","How do I use pull request refs to fetch all open PRs?"],"scripts":[]},{"name":"git-gitweb","title":"GitWeb","category":"git-collaboration","plugins":["git-collaboration","git-skills"],"area":"development","group":"git-collaboration","description":"Browse a git repository in a web browser with GitWeb or git instaweb. Use when handling a simple web viewer.","needs":"","path":"skills/development/git-collaboration/git-gitweb","examples":["Set up GitWeb to browse my repositories in a web browser.","Run a quick GitWeb instance with git instaweb.","Install GitWeb on Apache for all repos in /srv/git."],"scripts":[]},{"name":"git-hooks","title":"Git Hooks","category":"git-customization","plugins":["git-customization","git-skills"],"area":"development","group":"git-customization","description":"Write git hooks (pre-commit, commit-msg, pre-push, pre-receive). Use when you need to run a script automatically on commit, push or merge.","needs":"","path":"skills/development/git-customization/git-hooks","examples":["Block commits whose message doesn't start with a ticket ID like ABC-123.","Run my test suite before every commit with a pre-commit hook.","Which server-side hooks can reject a push?"],"scripts":[]},{"name":"git-in-powershell","title":"Git in PowerShell","category":"git-integrations","plugins":["git-integrations","git-skills"],"area":"development","group":"git-integrations","description":"Set up git in PowerShell with posh-git: prompt status and tab completion. Use when handling a git prompt on Windows PowerShell.","needs":"","path":"skills/dev t from C, Ruby, .NET or Python through libgit2 bindings. Use when you need to embed git operations in an application.","needs":"","path":"skills/development/git-integrations/git-libgit2","examples":["Use libgit2 to read a commit in C.","What language bindings exist for libgit2?","Create a commit programmatically with libgit2."],"scripts":[]},{"name":"git-maintenance-and-data-recovery","title":"Maintenance and Data Recovery","category":"git-internals","plugins":["git-internals","git-skills"],"area":"development","group":"git-internals","description":"Recover lost commits (reflog, fsck) and shrink a repository (gc, large files). Use when you are after reset --hard or for a huge .git.","needs":"","path":"skills/development/git-internals/git-maintenance-and-data-recovery","examples":["I deleted a branch by accident. How do I get it back?","Find and remove a huge file that is bloating my repository.","Recover lost commits with git fsck and the reflog."],"scripts":[]},{"name":"git-migrating-to-git","title":"Migrating to Git","category":"git-integrations","plugins":["git-integrations","git-skills"],"area":"development","group":"git-integrations","description":"Convert a Subversion, Mercurial or Perforce repository to git. Use when you need to import another VCS history.","needs":"","path":"skills/development/git-integrations/git-migrating-to-git","examples":["Migrate our SVN repository to Git, keeping history and authors.","Convert a Mercurial repo to Git.","Write a custom importer with git fast-import."],"scripts":[]},{"name":"git-objects","title":"Git Objects","category":"git-internals","plugins":["git-internals","git-skills"],"area":"development","group":"git-internals","description":"Git internals: blob, tree and commit objects and the .git/objects store. Use when you need to inspect how git stores data.","needs":"","path":"skills/development/git-internals/git-objects","examples":["Explain blobs, trees and commits in Git internals.","Create a Git object by hand with ha igin/develop.","Delete the branch 'old-feature' on the remote.","Show how far ahead of or behind its upstream each of my branches is."],"scripts":[]},{"name":"git-replace","title":"Replace","category":"git-power-tools","plugins":["git-power-tools","git-skills"],"area":"development","group":"git-power-tools","description":"Swap one git object for another with git replace to graft history. Use when you need to join or split history without rewriting it.","needs":"","path":"skills/development/git-power-tools/git-replace","examples":["Make Git treat one commit as if it were another with git replace.","Graft old project history onto a shortened repository.","How do I list and delete git replace refs?"],"scripts":[]},{"name":"git-rerere","title":"Rerere","category":"git-branching","plugins":["git-branching","git-skills"],"area":"development","group":"git-branching","description":"Reuse recorded merge conflict resolutions with git rerere. Use when resolving the same conflict repeatedly.","needs":"","path":"skills/development/git-branching/git-rerere","examples":["Make Git remember how I resolved conflicts so it reapplies the fix next time.","Turn on rerere and show me what it has recorded.","I keep resolving the same conflict on every rebase. How can Git automate that?"],"scripts":[]},{"name":"git-reset-demystified","title":"Reset Demystified","category":"git-power-tools","plugins":["git-power-tools","git-skills"],"area":"development","group":"git-power-tools","description":"Explain git reset and checkout: --soft, --mixed, --hard and the three trees. Use when unsure which reset mode to use.","needs":"","path":"skills/development/git-power-tools/git-reset-demystified","examples":["Explain the difference between git reset --soft, --mixed and --hard.","Undo my last commit but keep the changes staged.","What's the difference between git reset and git checkout on a file?"],"scripts":[]},{"name":"git-revision-selection","title":"Revision Selection","category":"git-power-tools"," e":"Smart HTTP","category":"git-collaboration","plugins":["git-collaboration","git-skills"],"area":"development","group":"git-collaboration","description":"Serve git over HTTP(S) with git-http-backend and authenticated push. Use when you need to host a repo over HTTP.","needs":"","path":"skills/development/git-collaboration/git-smart-http","examples":["Set up Smart HTTP for Git with Apache.","Configure git-http-backend so pushes over HTTP require a password.","Host Git over HTTPS on my own server."],"scripts":[]},{"name":"git-stashing-and-cleaning","title":"Stashing and Cleaning","category":"git-power-tools","plugins":["git-power-tools","git-skills"],"area":"development","group":"git-power-tools","description":"Shelve work with git stash and remove untracked files with git clean. Use when you need to switch branches with uncommitted changes.","needs":"","path":"skills/development/git-power-tools/git-stashing-and-cleaning","examples":["I have half-done changes and need to switch branches urgently.","Stash my changes including untracked files, then restore them later.","Remove all untracked files and folders, but show me what will be deleted first."],"scripts":[]},{"name":"git-submodules","title":"Submodules","category":"git-power-tools","plugins":["git-power-tools","git-skills"],"area":"development","group":"git-power-tools","description":"Use git submodules: add, clone --recurse-submodules, update, publish. Use when a repo contains another repo or submodule folders are empty.","needs":"","path":"skills/development/git-power-tools/git-submodules","examples":["Add a library as a git submodule.","Clone a repository together with all its submodules.","Update all submodules to their latest upstream commits."],"scripts":[]},{"name":"git-tagging","title":"Tagging","category":"git-getting-started","plugins":["git-getting-started","git-skills"],"area":"development","group":"git-getting-started","description":"Create, list, push and delete git tags. Use when you need to tag a
