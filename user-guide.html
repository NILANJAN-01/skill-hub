end-pack and receive-pack)?"],"scripts":[]},{"name":"git-undoing-things","title":"Undoing Things","category":"git-getting-started","plugins":["git-getting-started","git-skills"],"area":"development","group":"git-getting-started","description":"Undo git mistakes: amend, unstage, discard changes (restore, reset). Use when committed too early or staged the wrong file.","needs":"","path":"skills/development/git-getting-started/git-undoing-things","examples":["I forgot to add a file to my last commit. How do I fix it?","Unstage a file I accidentally added.","Throw away my local changes to config.yml."],"scripts":[]},{"name":"git-viewing-the-commit-history","title":"Viewing the Commit History","category":"git-getting-started","plugins":["git-getting-started","git-skills"],"area":"development","group":"git-getting-started","description":"View and filter history with git log (--oneline, --graph, --stat, by author or date). Use when you need to see or format the commit log.","needs":"","path":"skills/development/git-getting-started/git-viewing-the-commit-history","examples":["Show the last 5 commits with the diffs.","Find the commits that added or removed the string 'getUserToken'.","Show a one-line graph of the history of all branches."],"scripts":[]},{"name":"git-working-with-remotes","title":"Working with Remotes","category":"git-collaboration","plugins":["git-collaboration","git-skills"],"area":"development","group":"git-collaboration","description":"Manage git remotes: add, show, fetch, pull, push, rename, remove. Use when you need to add or change a remote URL.","needs":"","path":"skills/development/git-collaboration/git-working-with-remotes","examples":["List the remotes of this repository with their URLs.","Add a second remote called upstream and fetch from it.","Rename the remote 'origin' to 'github'."],"scripts":[]},{"name":"gitlab-ci-debugging","title":"GitLab CI debugging","category":"gitlab-ci-tools","plugins":["gitlab-ci-tools"],"area":"development","group":"gitlab-ci","description":"Diagnose a failing, stuck, skipped or wrongly triggered GitLab CI pipeline or job from its log and .gitlab-ci.yml. Use when the user says a GitLab pipeline is stuck, pending, not running, created no jobs, or a job fails (exit code, runner, rules, artifacts, Docker).","needs":"","path":"skills/development/gitlab-ci/gitlab-ci-debugging","examples":["My GitLab job says it's stuck because the project doesn't have any runners online. Why?","Here's the job log. Why did it fail with exit code 137?","My pipeline shows 'Pipeline will not run for the selected trigger'. What's wrong with my rules?"],"scripts":[]},{"name":"gitlab-ci-optimization","title":"GitLab CI optimization","category":"gitlab-ci-tools","plugins":["gitlab-ci-tools"],"area":"development","group":"gitlab-ci","description":"Make a GitLab CI pipeline faster and cheaper: needs (DAG), cache, parallel jobs, rules:changes, interruptible, smaller images, Docker layer caching. Use when the user says a GitLab pipeline is slow or wastes CI minutes.","needs":"","path":"skills/development/gitlab-ci/gitlab-ci-optimization","examples":["Our GitLab pipeline takes 40 minutes. How can we speed it up?","The cache doesn't seem to help in our pipeline. Can you tune it?","We're burning CI minutes on duplicate pipelines. How do I cut them?"],"scripts":[]},{"name":"gitlab-ci-pipeline-authoring","title":"GitLab CI pipeline authoring","category":"gitlab-ci-tools","plugins":["gitlab-ci-tools"],"area":"development","group":"gitlab-ci","description":"Write or change a GitLab CI pipeline (.gitlab-ci.yml): stages, jobs, rules, needs, artifacts, cache, includes and merge request pipelines. Use when the user asks to create or extend a GitLab pipeline or job, or run a job only on certain branches, tags or changes.","needs":"","path":"skills/development/gitlab-ci/gitlab-ci-pipeline-authoring","examples":["Create a .gitlab-ci.yml that builds, tests and deploys my Node app.","Add a job that only runs on merge requests when files in src/ change.","Split our huge .gitlab-ci.yml into includes and reusable templates."],"scripts":[]},{"name":"gradle-android","title":"Gradle for Android: setup, diagnosis, libraries and testing","category":"gradle-tools","plugins":["gradle-tools"],"area":"external-tools","group":"gradle","description":"Set up Gradle for Android apps and fix Gradle problems: wrapper, JDK, Android Gradle Plugin (AGP) and Kotlin compatibility, SDK path, version catalogs, adding libraries, running unit and instrumented tests, and diagnosing build failures with a bundled script. Use when a Gradle or Android build fails or will not sync, the user asks how to set up, upgrade or speed up Gradle, add a dependency, or run Android tests.","needs":"Needs Python 3.8+ (standard library only) for the scripts. Running builds needs a JDK 17+ and the Android SDK; the project's own Gradle wrapper is used.","path":"skills/external-tools/gradle/gradle-android","examples":["My Android build fails with 'Unsupported class file major version 65'. Find out why and fix it.","Check my Gradle setup: JDK, wrapper, AGP and Kotlin versions, and SDK path.","Add Retrofit to the app module using the version catalog.","Run only the CartTest.totalIsSummed unit test and tell me where the report is.","Here is my Gradle build log: why did the sync fail and what is the fix?"],"scripts":[{"file":"gradle_doctor.py","path":"skills/external-tools/gradle/gradle-android/scripts/gradle_doctor.py","summary":"Gradle doctor for Android projects: check setup, diagnose failures, apply safe fixes, add libraries, run tests.","usage":[]}]},{"name":"image-inspector","title":"Image inspector: pixels and description","category":"image-tools","plugins":["image-tools"],"area":"testing","group":"tools","description":"Inspect an image file (PNG, JPG, WebP, GIF, BMP, TIFF) with a ready-made Python script: pixel colours at coordinates, dominant colours and palette, transparency, size, EXIF, OCR text, finding an icon inside a screenshot, comparing two screenshots. Use when the user asks about an image or screenshot: its colours, size or text, where an icon is, or what changed between two.","needs":"Needs only Python 3.8+. The bundled pure-Python decoders read PNG, BMP, JPEG (baseline and progressive), GIF, TIFF and PNM with EXIF, and give the same pixels as Pillow; Pillow is used instead when installed because it is faster on big photos. WebP and HEIF/AVIF need Pillow or the ffmpeg program. OCR needs the Tesseract program (no Python package). --find, --compare and sharpness are pure Python.","path":"skills/testing/tools/image-inspector","examples":["Describe this screenshot.png for me: size, main colours and what's on it.","What is the exact hex colour of the pixel at 120,48 in banner.jpg?","Give me the dominant colour palette of logo.png and tell me if it has a transparent background.","Export every pixel of icon.png to a CSV and read the text in scan.jpg.","Where is play_icon.png on this screenshot? Give me the tap coordinates.","Compare after.png with before.png and show me what changed, ignoring the clock."],"scripts":[{"file":"cv_features.py","path":"skills/testing/tools/image-inspector/scripts/cv_features.py","summary":"Find a template image inside a screenshot, compare two screenshots and measure sharpness, for","usage":[]},{"file":"image_codecs.py","path":"skills/testing/tools/image-inspector/scripts/image_codecs.py","summary":"Image decoders and helpers in pure Python (standard library only), used by inspect_image.py.","usage":[]},{"file":"inspect_image.py","path":"skills/testing/tools/image-inspector/scripts/inspect_image.py","summary":"Read an image (PNG, JPEG, WebP, GIF, BMP, TIFF, ...) and report its pixels and a plain-text description.","usage":[]}]},{"name":"junit-migration","title":"JUnit migration and audit (JUnit 4/5 to 6, Java and Kotlin)","category":"junit-tools","plugins":["junit-tools"],"area":"testing","group":"junit","description":"Migrate Java and Kotlin tests from JUnit 3/4 or JUnit 5 to JUnit 6 (Jupiter) and audit a suite: imports, @Test(expected), rules, runners, Parameterized, categories, message order, removed JUnit 6 APIs, tests that never run (private, static, non-void, static @Nested), weak tests and build setup. A script reports each issue with file, line and fix. Use when the user wants to upgrade or review JUnit tests.","needs":"The audit script needs Python 3.8+ (standard library only) and only reads files. Verifying a migration needs JDK 17+ and the project's Gradle or Maven build. Part of the junit-tools bundle with junit-test-authoring and junit-run-reports.","path":"skills/testing/junit/junit-migration","examples":["Migrate our JUnit 4 tests to JUnit 5/6: rules, @Test(expected) and Parameterized runners.","We upgraded to JUnit 6 and the build fails with MethodOrderer.Alphanumeric not found. What else breaks?","Audit our test suite for tests that never run or have no assertions.","Half our tests stopped running after adding junit-jupiter. Why?"],"scripts":[{"file":"junit_audit.py","path":"skills/testing/junit/junit-migration/scripts/junit_audit.py","summary":"Audit JUnit tests (Java and Kotlin) and their build for migration problems and weak or flaky tests.","usage":["python junit_audit.py <project-dir-or-file> [--json] [--strict] [--only RULE ...] [--rules]"]}]},{"name":"junit-run-reports","title":"JUnit: run tests and explain the results","category":"junit-tools","plugins":["junit-tools"],"area":"testing","group":"junit","description":"Run JUnit tests (Java or Kotlin) with Gradle, Maven or the ConsoleLauncher, select by class, method, package or tag, rerun failures, and explain results from JUnit XML or Open Test Reporting files: each failure with cause and fix, flaky tests, skipped tests without a reason, slowest tests, a Markdown CI summary. Use when JUnit tests must be run, fail, flake or need a report.","needs":"Needs Python 3.8+ (standard library only). Running tests needs JDK 17+ and the project's Gradle wrapper or Maven (or the JUnit ConsoleLauncher jar); reading reports needs nothing else. Part of the junit-tools bundle with junit-test-authoring and junit-migration.","path":"skills/testing/junit/junit-run-reports","examples":["Run only OrderServiceTest#placesOrder with Maven and tell me why it fails.","Summarise the JUnit XML results in target/surefire-reports and list the flaky tests.","Run the tests tagged fast with Gradle and show the slowest ones.","Turn our JUnit results into a Markdown summary for the GitHub Actions job."],"scripts":[{"file":"junit_report.py","path":"skills/testing/junit/junit-run-reports/scripts/junit_report.py","summary":"Run JUnit tests (Java and Kotlin) and explain the results.","usage":["python junit_report.py cmd --tool gradle|maven|console [selection] [--module M]","python junit_report.py run [--tool gradle|maven] [selection] [--project DIR] [--dry-run] [--json]","python junit_report.py parse PATH [PATH ...] [--json] [--markdown] [--slowest N]","python junit_report.py results [PROJECT_DIR] [--json] [--markdown] [--slowest N]"]}]},{"name":"junit-test-authoring","title":"JUnit 6 test authoring (Java and Kotlin)","category":"junit-tools","plugins":["junit-tools"],"area":"testing","group":"junit","description":"Write JUnit 6 (Jupiter) tests in Java or Kotlin: Gradle/Maven setup, assertions, lifecycle, @Nested, @DisplayName, tags, @ParameterizedTest and @ParameterizedClass, dynamic tests, @TempDir, @Timeout, conditions, extensions and parallel runs. A script checks the build setup and generates a test class for a source file. Use when the user wants JUnit tests written or JUnit set up.","needs":"Scripts need Python 3.8+ (standard library only). The tests need JDK 17+ and Gradle or Maven with JUnit 6.1.3 (Kotlin 2.2+ for Kotlin tests). Works with junit-migration and junit-run-reports (the junit-tools bundle); kotlin-unit-test adds coverage and mutation checks for Kotlin.","path":"skills/testing/junit/junit-test-authoring","examples":["Set up JUnit 6 in our Gradle project and write tests for the OrderService class.","Write JUnit tests for PriceCalculator.java, including a parameterized test for the price rules.","Generate a JUnit test class for Basket.kt with nested groups per function.","How do I test that this method throws IllegalArgumentException with the right message in JUnit 5?","Make this JUnit test run for both postgres and mysql without copying the class."],"scripts":[{"file":"junit_scaffold.py","path":"skills/testing/junit/junit-test-authoring/scripts/junit_scaffold.py","summary":"Set up JUnit 6 (Jupiter) and scaffold test classes for Java and Kotlin code.","usage":["python junit_scaffold.py check <project-dir> [--json]","python junit_scaffold.py deps [--build gradle-kts|gradle-groovy|toml|maven] [--kotlin] [--vintage]","python junit_scaffold.py new <Source.java|Source.kt> [--out DIR] [--stdout] [--force]","[--no-parameterized] [--test-suffix Test]"]}]},{"name":"kotlin-unit-test","title":"Kotlin unit tests: class/method-wise testing, verification and HTML report","category":"testing-tools","plugins":["testing-tools","junit-tools"],"area":"testing","group":"libs","description":"Write, run and verify unit tests for Kotlin code (apps, libraries, Android, Appium/Selenium page objects) with Gradle, Maven or kotlinc, then produce an HTML report of results, coverage and weak tests (no assertions, disabled, untested methods, mutation check). Use when the user asks to unit test Kotlin code, add or run Kotlin tests, get a test or coverage report, or check test quality.","needs":"Needs Python 3.8+ (standard library only) to run the scripts, and a JDK with the project's build tool (Gradle wrapper, Maven, or kotlinc plus the JUnit console launcher) to run the tests. Coverage needs JaCoCo or Kover configured in the build.","path":"skills/testing/libs/kotlin-unit-test","examples":["Write unit tests for every method of OrderService.kt and run them.","Run the Kotlin tests for class PriceCalculator and give me an HTML report.","Which methods in this Kotlin project have no tests, and are the existing tests actually asserting anything?","Unit test our Appium LoginPage page object without a device.","Check whether the tests for CartRepository would catch a bug (mutation check)."],"scripts":[{"file":"checks.py","path":"skills/testing/libs/kotlin-unit-test/scripts/checks.py","summary":"Project scan, test-to-code mapping (class-wise and method-wise) and test verification rules.","usage":[]},{"file":"html_report.py","path":"skills/testing/libs/kotlin-unit-test/scripts/html_report.py","summary":"Render the ktest report (report.json) as one self-contained HTML file (no external resources).","usage":[]},{"file":"kotlin_source.py","path":"skills/testing/libs/kotlin-unit-test/scripts/kotlin_source.py","summary":"Light-weight Kotlin source scanner (Python 3.8+, standard library only).","usage":[]},{"file":"ktest.py","path":"skills/testing/libs/kotlin-unit-test/scripts/ktest.py","summary":"Plan, run and verify unit tests for Kotlin code, class by class and method by method, and write an HTML report.","usage":[]},{"file":"results.py","path":"skills/testing/libs/kotlin-unit-test/scripts/results.py","summary":"Read test results and coverage (Python 3.8+, standard library only).","usage":[]}]},{"name":"lint-checker","title":"Lint checker: find and run linters for any language","category":"code-quality-tools","plugins":["code-quality-tools"],"area":"development","group":"code-quality","description":"Lint code and check it against coding standards in any programming language. A bundled script detects the project's languages, the linters it configures and the ones installed, runs them (ruff, ESLint, golangci-lint, clippy, Gradle/Maven Checkstyle, PMD, SpotBugs, ktlint, detekt, Android Lint and more) in one report, and adds built-in checks needing no tools. Use when the user asks to lint, check code quality, style or coding standards, run static analysis, or fix lint errors.","needs":"Needs Python 3.8+ (standard library only). Runs the linters the project pins or the machine has installed and never installs any; Java and Kotlin linting needs a JDK; the TOML syntax check needs Python 3.11+.","path":"skills/development/code-quality/lint-checker","examples":["Lint this project and tell me what's wrong.","Run the linters on the files I changed before I commit.","CI's lint job is failing; find and fix the lint errors.","Check my Java and Kotlin code for lint issues with Checkstyle, detekt and ktlint.","Set up linting for this Go and TypeScript repo."],"scripts":[{"file":"lint_check.py","path":"skills/development/code-quality/lint-checker/scripts/lint_check.py","summary":"Find, run and summarise linters for a project in any programming language.","usage":["python lint_check.py detect [PATH]       languages, configured and installed linters, the plan","python lint_check.py run [PATH]          run the planned linters plus the built-in checks","python lint_check.py basic [PATH ...]    built-in checks only (files or folders, default .)","python lint_check.py list                every linter this script knows"]}]},{"name":"llm-evals","title":"LLM evals: test sets, scoring and regression checks","category":"ai-agent-tools","plugins":["ai-agent-tools"],"area":"development","group":"ai-agents","description":"Build and run evals for an LLM prompt or agent: case sets, code checks (contains, regex, JSON, tool called), LLM-as-judge, pass rate by tag and regressions against a baseline, with a scoring script. Use when the user wants to test a prompt or agent, compare models or prompt versions, measure answer quality or gate a release in CI.","needs":"Needs Python 3.8+ (standard library only) for the scoring script. Generating outputs uses whatever model or agent the project already calls.","path":"skills/development/ai-agents/llm-evals","examples":["Set up an eval set for our summarization prompt and score the current outputs.","Compare the new prompt version against last week's baseline and list regressions.","Add an LLM eval to CI that fails the build if the pass rate drops below 90%."],"scripts":[{"file":"eval_score.py","path":"skills/development/ai-agents/llm-evals/scripts/eval_score.py","summary":"Score LLM / agent outputs against an eval case set.","usage":["python eval_score.py cases.jsonl outputs.jsonl [--report out.json]","[--baseline old_report.json] [--min-pass 0.9] [--no-regressions] [--json]"]}]},{"name":"mcp-server-builder","title":"MCP server builder: create, probe and debug MCP servers","category":"ai-agent-tools","plugins":["ai-agent-tools"],"area":"development","group":"ai-agents","description":"Build, test and debug a Model Context Protocol (MCP) server in Python or TypeScript, with a script that runs the handshake, lists and lints tools, and calls one. Use when the user wants to create an MCP server, wrap an API as MCP tools, or says an MCP server does not start, shows no tools, times out or prints invalid JSON.","needs":"Needs Python 3.8+ (standard library only) for the probe script. The server itself can be written in any language with an MCP SDK.","path":"skills/development/ai-agents/mcp-server-builder","examples":["Build an MCP server in Python that exposes our internal notes search as a tool.","My MCP server starts but the agent shows no tools. Probe it and tell me what is wrong.","Wrap this REST API as an MCP server in TypeScript and test it before I add it to my agent."],"scripts":[{"file":"mcp_probe.py","path":"skills/development/ai-agents/mcp-server-builder/scripts/mcp_probe.py","summary":"Smoke-test an MCP server over stdio and lint what it exposes.","usage":["python mcp_probe.py [--timeout 15] [--call TOOL --args JSON] [--json] -- <command> [args...]"]}]},{"name":"obvious-code","title":"Obvious code: comments, names and consistency","category":"software-design-tools","plugins":["software-design-tools"],"area":"development","group":"software-design","description":"Write code a first-time reader understands: interface comments and docstrings that add what the code cannot say, implementation comments that explain what and why, precise and consistent names, following the project's conventions, and avoiding nonobvious constructs. Use when writing or reviewing comments, docstrings, Javadoc, JSDoc or KDoc, naming things, or when code is hard to read or comments are useless or stale.","needs":"","path":"skills/development/software-design/obvious-code","examples":["Write good docstrings for the public functions in this module.","These comments just repeat the code. Rewrite them to be useful.","Suggest better names for the variables and functions in this file."],"scripts":[]},{"name":"playwright-ci","title":"Playwright in CI: pipelines, sharding and reports","category":"playwright-tools","plugins":["playwright-tools"],"area":"testing","group":"playwright","description":"Run Playwright tests in CI: GitHub Actions, GitLab CI, Azure Pipelines or Jenkins, with sharding, merged HTML reports, JUnit results, traces as artifacts, the matching Docker image and secrets. A script generates the pipeline file from the project. Use when the user wants Playwright in CI, faster runs with shards, or CI reports and artifacts.","needs":"The generator needs Python 3.8+ (standard library only). Pipelines run Node.js with @playwright/test, or Python with pytest-playwright.","path":"skills/testing/playwright/playwright-ci","examples":["Add Playwright to GitHub Actions with 4 shards and one merged HTML report.","Generate a GitLab CI job for our Playwright suite using the right Docker image.","Our Playwright run takes 40 minutes in Jenkins; split it into parallel shards."],"scripts":[{"file":"pw_ci.py","path":"skills/testing/playwright/playwright-ci/scripts/pw_ci.py","summary":"Generate a CI pipeline for Playwright tests (GitHub Actions, GitLab CI, Azure Pipelines, Jenkins).","usage":["python pw_ci.py --ci github|gitlab|azure|jenkins [--project-dir .] [--shards 4] [--lang node|python]","[--env NAME]... [--grep @smoke] [--browsers chromium,firefox] [--out FILE] [--force]"]}]},{"name":"playwright-debugging","title":"Playwright debugging: failing and flaky tests","category":"playwright-tools","plugins":["playwright-tools"],"area":"testing","group":"playwright","description":"Find why Playwright tests fail or flake: read the report and traces, sort failures by cause (timeout, strict mode, assertion, navigation, closed page, screenshot diff), list flaky and slow tests, and fix the root cause. A script summarises Playwright JSON or JUnit reports. Use when Playwright tests fail, time out, or pass locally but fail in CI.","needs":"The report script needs Python 3.8+ (standard library only). Traces open with the Playwright CLI (Node.js) or trace.playwright.dev.","path":"skills/testing/playwright/playwright-debugging","examples":["Our Playwright tests pass locally but fail in CI. Here is results.json, find out why.","Which Playwright tests are flaky in this report and what is causing them?","This test times out on the Pay button; read the trace and fix it."],"scripts":[{"file":"pw_report.py","path":"skills/testing/playwright/playwright-debugging/scripts/pw_report.py","summary":"Summarise a Playwright test report (JSON reporter or JUnit XML).","usage":["python pw_report.py <results.json|results.xml> [--slowest 10] [--baseline old-report] [--json]"]}]},{"name":"playwright-mcp-browser","title":"Playwright MCP: let the agent use a browser, then keep it as a test","category":"playwright-tools","plugins":["playwright-tools"],"area":"testing","group":"playwright","description":"Drive a real browser through the Playwright MCP server: explore a web app, reproduce a bug report, check a deployment, fill forms, read console and network, then turn what worked into a Playwright test. Also covers Playwright's planner, generator and healer test agents. Use when the user asks the agent to open, click through, check or test a website in a browser.","needs":"Needs the Playwright MCP server (@playwright/mcp, Node.js) registered with the agent. Writing tests from the session needs @playwright/test or pytest-playwright.","path":"skills/testing/playwright/playwright-mcp-browser","examples":["Open our staging site, sign in as the test user and check that checkout works.","Reproduce this bug report in the browser and tell me what errors show in the console.","Click through the new settings page and turn what you did into a Playwright test."],"scripts":[]},{"name":"playwright-test-authoring","title":"Playwright test authoring: resilient E2E tests that fit your team","category":"playwright-tools","plugins":["playwright-tools"],"area":"testing","group":"playwright","description":"Write and review Playwright end-to-end tests (TypeScript/JavaScript or Python) that fit the team's conventions: resilient locators, web-first assertions, fixtures, page objects, login reuse, API, visual and accessibility checks. A script audits a suite and its config for flaky patterns. Use when the user wants Playwright tests written, reviewed or set up.","needs":"The audit script needs Python 3.8+ (standard library only). Running tests needs Node.js with @playwright/test, or Python with pytest-playwright.","path":"skills/testing/playwright/playwright-test-authoring","examples":["Write Playwright tests for our login and checkout flow using our data-qa attributes.","Audit our Playwright suite for flaky patterns and fix the worst ones.","Set up Playwright in this repo with login reuse, staging and production base URLs, and an @smoke tag."],"scripts":[{"file":"pw_audit.py","path":"skills/testing/playwright/playwright-test-authoring/scripts/pw_audit.py","summary":"Audit a Playwright test suite and its config for flaky or brittle patterns.","usage":["python pw_audit.py <project-dir> [--json] [--strict]"]}]},{"name":"playwright-upgrade","title":"Playwright upgrade: breaking changes, affected code, steps","category":"playwright-tools","plugins":["playwright-tools"],"area":"testing","group":"playwright","description":"Upgrade Playwright safely to a newer version (up to 1.65): list the breaking changes and removed APIs between the current and target versions, find every affected place in tests, config, CI files and Docker image tags, then update packages, browsers, Node.js and baselines. A script builds the plan. Use when the user wants to upgrade Playwright or a newer version broke the tests.","needs":"The planning script needs Python 3.8+ (standard library only). Its release data covers Playwright 1.50 to 1.65; check the release notes for later versions.","path":"skills/testing/playwright/playwright-upgrade","examples":["Upgrade our Playwright from 1.48 to the latest version and tell me what will break.","We bumped Playwright and CI now fails with Node and Docker errors; fix the upgrade.","Which removed Playwright APIs does this repo still use?"],"scripts":[{"file":"pw_upgrade.py","path":"skills/testing/playwright/playwright-upgrade/scripts/pw_upgrade.py","summary":"Plan a Playwright upgrade: breaking changes between two versions, and where the project is affected.","usage":["python pw_upgrade.py <project-dir> [--from 1.48] [--to 1.65] [--json]"]}]},{"name":"powershell-commands","title":"PowerShell Commands for Agents","category":"shell-tools","plugins":["shell-tools"],"area":"external-tools","group":"powershell","description":"Run shell tasks correctly in PowerShell on Windows: files, text search, processes, network, Git, builds, with a bash-to-PowerShell map. Use when the shell is PowerShell, a `&&`, `grep`, `head` or `export` command fails, or quoting, encoding or exit codes go wrong.","needs":"Windows PowerShell 5.1 and PowerShell 7+ (commands marked 7+ do not work in 5.1). Most commands also work on macOS/Linux with PowerShell 7.","path":"skills/external-tools/powershell/powershell-commands","examples":["This `git add . && git commit` fails in PowerShell with a token '&&' error. How do I run it?","Translate this bash one-liner to PowerShell: grep -rn TODO src | wc -l","Write a PowerShell command to find the 10 biggest files under C:\\src and show their sizes in MB.","My PowerShell script writes UTF-16 files and the other tool can't read them. Fix the encoding."],"scripts":[]},{"name":"professional-writing","title":"Professional writing: blog, CV, docs","category":"writing-tools","plugins":["writing-tools"],"area":"generic","group":"writing","description":"Write, tailor and review professional documents: blog posts, CVs/resumes (tailor to a job post, review), cover letters, technical docs and READMEs, with a checker script and templates. Use when the user wants to write a blog post or article, prepare or improve a CV, match a CV to a job ad, or draft documentation.","needs":"Scripts need Python 3.8+ (standard library only). They read .md, .txt and .docx; export a PDF to text or .docx first.","path":"skills/generic/writing/professional-writing","examples":["Help me write a blog post comparing test tools for Android: Espresso, UI Automator and Appium.","Here's my CV and a job post. Tailor my CV to this role without making anything up.","Review my CV and tell me the top 3 things to fix.","Draft a README and a how-to guide for my project."],"scripts":[{"file":"doc_check.py","path":"skills/generic/writing/professional-writing/scripts/doc_check.py","summary":"Check a professional document (blog post, CV/resume, technical doc) and report concrete problems.","usage":[]},{"file":"new_doc.py","path":"skills/generic/writing/professional-writing/scripts/new_doc.py","summary":"Create a new document from a bundled template.","usage":[]}]},{"name":"python-tutor","title":"Python tutor: explain a file and make interview notes","category":"learning-tools","plugins":["learning-tools"],"area":"generic","group":"learning","description":"Explain any .py file from beginner to advanced and make study-notes HTML for interview prep: line-by-line walkthrough, concepts found, gotchas, interview Q&A, fundamentals checklist. A bundled script analyses the file without running it. Use when the user wants to learn, understand or revise a Python file or prepare for a Python interview.","needs":"Needs Python 3.8+ (standard library only). The analysed file must be Python 3 source. The file is parsed, never imported or executed.","path":"skills/generic/learning/python-tutor","examples":["Explain this Python file to me like I'm a beginner, then go deeper, and make me an HTML study page.","I have a Python interview next week. Use utils.py to prepare notes and questions for me.","Walk me through app.py line by line and tell me which concepts I should revise.","Make interview-prep notes in HTML for every .py file in this folder."],"scripts":[{"file":"py_tutor.py","path":"skills/generic/learning/python-tutor/scripts/py_tutor.py","summary":"Python tutor: study notes for any .py file, from beginner to advanced, for interview preparation.","usage":[]},{"file":"py_tutor_behaviour.py","path":"skills/generic/learning/python-tutor/scripts/py_tutor_behaviour.py","summary":"Static \"what does this file do\" analysis for py_tutor.py: public API, inputs and outputs, side effects,","usage":[]},{"file":"py_tutor_concepts.py","path":"skills/generic/learning/python-tutor/scripts/py_tutor_concepts.py","summary":"The concept catalogue used by py_tutor.py: what a Python concept is, why it matters, the usual trap,","usage":[]}]},{"name":"python-unit-test","title":"Python unit tests: write, run, diagnose and suggest fixes","category":"testing-tools","plugins":["testing-tools"],"area":"testing","group":"libs","description":"Unit test any Python (.py) file function by function and method by method, run the tests, and get a diagnosis with a suggested fix for each failure, plus static bug findings (mutable defaults, bare except, swallowed errors) and weak-test checks. Use when the user asks to unit test, add or run tests for a .py file, find why a Python test fails, fix a failing pytest/unittest test, find untested functions, or check Python code for bugs.","needs":"Needs Python 3.8+ (standard library only) to run the script. It uses pytest when installed and falls back to unittest. Line coverage needs the coverage package.","path":"skills/testing/libs/python-unit-test","examples":["Write unit tests for every function in utils.py and run them.","Unit test parser.py and suggest a fix for whatever fails.","Why does test_billing.py fail? Show me the bug and the fix.","Which functions in this .py file have no tests, and are the existing tests asserting anything?"],"scripts":[{"file":"pyunit.py","path":"skills/testing/libs/python-unit-test/scripts/pyunit.py","summary":"Unit-test any Python file and suggest fixes. Standard library only (Python 3.8+).","usage":[]}]},{"name":"rag-pipeline","title":"RAG pipeline: chunk, retrieve, ground and evaluate","category":"ai-agent-tools","plugins":["ai-agent-tools"],"area":"development","group":"ai-agents","description":"Build and debug a RAG (retrieval-augmented generation) pipeline: chunking, embeddings, hybrid search, reranking, cited answers, with a script that chunks docs and scores retrieval (recall@k, MRR). Use when the user wants to chat with documents, pick a chunk size or vector store, or says retrieval finds the wrong passages.","needs":"Needs Python 3.8+ (standard library only) for the script. Embedding models and vector stores are whatever the project uses.","path":"skills/development/ai-agents/rag-pipeline","examples":["Build a RAG pipeline so users can chat with our Markdown docs.","Our RAG bot answers without using the docs. Find out if retrieval is the problem.","Chunk the docs folder and measure recall@5 for these labelled questions."],"scripts":[{"file":"rag_tool.py","path":"skills/development/ai-agents/rag-pipeline/scripts/rag_tool.py","summary":"Chunk documents for RAG and score retrieval results.","usage":["python rag_tool.py chunk <file-or-dir>... [--size 1200] [--overlap 150] [--out chunks.jsonl]","python rag_tool.py score queries.jsonl results.jsonl [--k 1,3,5,10] [--match exact|source] [--json]"]}]},{"name":"repo-architecture","title":"Repo walkthrough and architecture diagram","category":"repo-tools","plugins":["repo-tools"],"area":"development","group":"repo","description":"Walk through a repository and produce an architecture diagram as ARCHITECTURE.md (with Mermaid) and a self-contained architecture.html: components, dependencies, entry points, flows, reading order. A bundled script drafts it from the code. Use when the user asks for an architecture diagram, a system overview, a repo walkthrough or onboarding map of a codebase.","needs":"Needs Python 3.8+ (standard library only). git is optional; with git the file list follows .gitignore and a repository can be cloned from a URL.","path":"skills/development/repo/repo-architecture","examples":["Make an architecture diagram of this repo as ARCHITECTURE.md and an HTML page.","Give me a walkthrough of this codebase: what the main parts are, how they depend on each other and what to read first.","Draw a component diagram for https://github.com/owner/project and explain the main request flow.","I'm onboarding onto this repo. Prepare an architecture overview I can share with the team."],"scripts":[{"file":"repo_architecture.py","path":"skills/development/repo/repo-architecture/scripts/repo_architecture.py","summary":"Repo architecture: walk a repository and draw its architecture as ARCHITECTURE.md and architecture.html.","usage":[]}]},{"name":"repo-learnings","title":"Repository deep read to LEARNINGS.md","category":"repo-tools","plugins":["repo-tools"],"area":"development","group":"repo","description":"Read a whole git repository, every folder and file, line by line, and write a LEARNINGS.md: purpose, build and run steps, folder map, architecture, key files, conventions, gotchas and file-by-file notes. A bundled Python script plans the read and checks that no file was missed. Use when the user wants to study, understand, document or onboard onto a codebase or repo, local or by git URL.","needs":"Needs Python 3.8+ (standard library only). git is optional. With git, the file list follows .gitignore and a repository can be cloned from a URL.","path":"skills/development/repo/repo-learnings","examples":["Read this whole repo, every folder and file, and write a learnings .md so I understand how it works.","I just joined this project. Go through the codebase deeply and create an onboarding document.","Clone https://github.com/owner/project and document what you learn: architecture, how to build it, key files and gotchas.","Study the src and docs folders line by line and give me a LEARNINGS.md."],"scripts":[{"file":"repo_learnings.py","path":"skills/development/repo/repo-learnings/scripts/repo_learnings.py","summary":"Repo learnings: plan a complete read of a repository and check that the notes cover it.","usage":[]}]},{"name":"rest-api-testing","title":"REST API testing for web applications","category":"api-testing-tools","plugins":["api-testing-tools"],"area":"testing","group":"api","description":"Test the REST APIs of web applications reliably, in any field (banking, healthcare, e-commerce, telecom, SaaS): plan cases from an OpenAPI spec, write functional, negative, auth and contract tests, and run them with a script that retries only safe requests, polls instead of sleeping, masks secrets and writes JUnit reports. Use when the user wants API tests written, run or reviewed, or says API tests are flaky.","needs":"The script needs Python 3.8+ and nothing else (standard library only; YAML specs are read by the bundled yaml_lite.py). It sends real HTTP requests, so it needs network access to the API under test. Framework examples need their own toolchains (JDK for REST Assured and Karate, Node.js for Newman, SuperTest and Playwright).","path":"skills/testing/api/rest-api-testing","examples":["Write API tests for our orders REST endpoints: create, read, update, delete, plus validation and auth errors.","Generate an API test suite from our openapi.json and run it against staging with a JUnit report for CI.","Our REST API tests are flaky in CI. Review them and make them reliable.","Check that user A cannot read user B's invoices through the API.","We are a bank: what should we test in our payments API, and can you automate it with REST Assured?"],"scripts":[{"file":"api_check.py","path":"skills/testing/api/rest-api-testing/scripts/api_check.py","summary":"Run, lint and generate REST API test suites for web applications (Python standard library only).","usage":["python api_check.py run SUITE.json [--env FILE] [--var NAME=VALUE] [--base-url URL] [--tag T] [--skip-tag T]","[--only NAME] [--read-only] [--fail-fast] [--no-retry] [--junit FILE] [--json FILE]","[--report FILE] [--insecure] [--verbose]","python api_check.py lint SUITE.json [--strict]","python api_check.py plan OPENAPI.json [--out SUITE.json]","python api_check.py example [--out SUITE.json]"]},{"file":"yaml_lite.py","path":"skills/testing/api/rest-api-testing/scripts/yaml_lite.py","summary":"A small YAML reader for configuration and OpenAPI files (Python standard library only).","usage":[]}]},{"name":"robotframework-ci","title":"Robot Framework in CI: run, rerun, parallelise, report","category":"robotframework-tools","plugins":["robotframework-tools"],"area":"testing","group":"robot-framework","description":"Run Robot Framework in CI and from the command line: GitHub Actions, GitLab CI, Azure Pipelines or Jenkins, tag selection, typed and secret variables, rerun of failed tests with rebot merge, parallel runs with pabot, JUnit results, JSON output and Robocop checks. A script generates the pipeline. Use when the user wants Robot tests in CI, faster runs, or reliable reports.","needs":"The generator needs Python 3.8+ (standard library only). Pipelines run Robot Framework 7.x on Python 3.8+; the Browser library also needs Node.js (or its Docker image).","path":"skills/testing/robot-framework/robotframework-ci","examples":["Add Robot Framework tests to GitHub Actions with a rerun of failed tests.","Run our Robot suite in parallel with pabot in GitLab CI and publish JUnit results.","Create a Jenkinsfile for our Robot Framework tests with the Browser library."],"scripts":[{"file":"rf_ci.py","path":"skills/testing/robot-framework/robotframework-ci/scripts/rf_ci.py","summary":"Generate a CI pipeline for Robot Framework (GitHub Actions, GitLab CI, Azure Pipelines, Jenkins).","usage":["python rf_ci.py --ci github|gitlab|azure|jenkins [--project-dir .] [--tests tests]","[--pabot N] [--no-rerun] [--include TAG] [--variablefile FILE]","[--env NAME]... [--browser-lib] [--out FILE] [--force]"]}]},{"name":"robotframework-libraries","title":"Robot Framework libraries: Python keywords done right","category":"robotframework-tools","plugins":["robotframework-tools"],"area":"testing","group":"robot-framework","description":"Write Python keyword libraries for Robot Framework with the current API: @library and @keyword, type hints and argument conversion (Literal, enums, TypedDict, custom converters, Secret, Python 3.12 type aliases), embedded arguments, async keywords, logging, listeners, and Libdoc docs in Markdown. A script reviews a library. Use when creating or reviewing custom Robot Framework libraries.","needs":"The review script needs Python 3.8+ (standard library only). Libraries target Robot Framework 7.x; Secret needs 7.4+, Markdown Libdoc and type aliases 7.5+.","path":"skills/testing/robot-framework/robotframework-libraries","examples":["Write a Python keyword library for our Orders API to use in Robot Framework.","Review our custom Robot Framework library: types, docs and logging.","Generate Markdown documentation for this Robot library with Libdoc."],"scripts":[{"file":"rf_lib_lint.py","path":"skills/testing/robot-framework/robotframework-libraries/scripts/rf_lib_lint.py","summary":"Review a Robot Framework Python keyword library (static analysis, nothing is imported or run).","usage":["python rf_lib_lint.py <library.py or folder> [--json] [--strict]"]}]},{"name":"robotframework-results","title":"Robot Framework results: failures, flaky tests and slow keywords","category":"robotframework-tools","plugins":["robotframework-tools"],"area":"testing","group":"robot-framework","description":"Find why Robot Framework tests or tasks failed: read output.xml or output.json, log.html and the console, sort failures by cause (assertion, missing keyword, variable, timeout, setup, UI element, connection, import), show the failing keyword chain, spot flaky tests with --rerunfailed and compare runs. A script summarises results. Use when a Robot run failed, is flaky or got slow.","needs":"The script needs Python 3.8+ (standard library only) and reads output.xml from RF 4-7 (RF 7 ISO timestamps and RF 6 start/end times) and output.json from RF 7.2+.","path":"skills/testing/robot-framework/robotframework-results","examples":["Our Robot Framework run failed in CI; here is output.xml, tell me why.","Which Robot tests are flaky? Compare output.xml with the rerun output.","Why did our Robot suite get so slow? Find the slowest keywords."],"scripts":[{"file":"rf_results.py","path":"skills/testing/robot-framework/robotframework-results/scripts/rf_results.py","summary":"Summarise Robot Framework results: output.xml (RF 4-7) or output.json (RF 7.2+).","usage":["python rf_results.py <output.xml|output.json> [--rerun rerun.xml] [--baseline old-output.xml]","[--slowest 10] [--json]"]}]},{"name":"robotframework-test-authoring","title":"Robot Framework authoring: modern 7.x syntax and an audit","category":"robotframework-tools","plugins":["robotframework-tools"],"area":"testing","group":"robot-framework","description":"Write, review and modernise Robot Framework tests and tasks with the current 7.x syntax: VAR, typed variables, GROUP, secret variables, IF/TRY/WHILE, RETURN, keyword setup, test metadata and Markdown test files, plus Browser, SeleniumLibrary and RequestsLibrary. A script audits suites for outdated or deprecated syntax. Use when the user writes, reviews or upgrades .robot files.","needs":"The audit script needs Python 3.8+ (standard library only). Tests need Robot Framework 7.x (latest 7.5.x, Python 3.8+); some features need newer versions (noted inline).","path":"skills/testing/robot-framework/robotframework-test-authoring","examples":["Write Robot Framework tests for our login and checkout using the Browser library.","Modernise these old .robot files to Robot Framework 7 syntax (VAR, IF, RETURN).","Move the passwords in our robot variables to secret variables from the environment."],"scripts":[{"file":"rf_audit.py","path":"skills/testing/robot-framework/robotframework-test-authoring/scripts/rf_audit.py","summary":"Audit Robot Framework suites for outdated, deprecated or risky syntax (checked against RF 7.5).","usage":["python rf_audit.py <dir-or-file> [--json] [--strict] [--max-steps 30]"]}]},{"name":"skill-dispatcher","title":"Skill dispatcher","category":"hub-tools","plugins":["hub-tools"],"area":"generic","group":"hub","description":"Read the user's prompt, split it into tasks, assign each task the matching installed skill and group independent tasks into waves that run in parallel as sub-agents, each with a self-contained brief. Can run automatically on every prompt from an agent's prompt-submit hook. Use when a request has several parts, the user wants skills to work in parallel or the job done faster, or wants prompts routed to skills automatically.","needs":"Needs Python 3.8+ (standard library only) and the skill-router skill installed next to it (it provides the matcher). Parallel runs need an agent that can start sub-agents; otherwise tasks run in order. Read-only.","path":"skills/generic/hub/skill-dispatcher","examples":["Analyse this logcat for crashes, and also write Python unit tests for utils.py. Run them in parallel so it's faster.","Split this request into tasks, assign a skill to each and run the independent ones as parallel sub-agents.","Set up a prompt-submit hook so every prompt I type is routed to the right skills automatically.","Which parts of this job can run at the same time, and which have to wait for an earlier result?"],"scripts":[{"file":"dispatch.py","path":"skills/generic/hub/skill-dispatcher/scripts/dispatch.py","summary":"Turn a user's prompt into a parallel plan: which skills to run, which can run at the same time, and a brief for each.","usage":[]}]},{"name":"skill-orchestrator","title":"Skill orchestrator","category":"hub-tools","plugins":["hub-tools"],"area":"generic","group":"hub","description":"Combine several installed skills to finish a multi-step task: find which skills are installed, pick the right ones, check they can run (adb, Python packages), run them in order and pass each result to the next. Use when a task needs more than one skill, or the user asks which skills to use, to chain skills, or to plan and track a multi-skill job.","needs":"Needs Python 3.8+ (standard library only). It reads skill folders and writes only inside a run folder you choose.","path":"skills/generic/hub/skill-orchestrator","examples":["Which of my installed skills should I use to analyse this logcat and write a bug report?","Chain the right skills to read this repo and then write a blog post about it.","Check that the skills I need for Android UI testing have everything they need installed.","Plan this job step by step across skills and keep track of the results as we go."],"scripts":[{"file":"orchestrate.py","path":"skills/generic/hub/skill-orchestrator/scripts/orchestrate.py","summary":"Connect installed skills: find them, match a task, check requirements, plan a chain, track hand-offs.","usage":[]}]},{"name":"skill-router","title":"Skill router","category":"hub-tools","plugins":["hub-tools"],"area":"generic","group":"hub","description":"Route a request to the right installed skills: split it into parts, grade basic or advanced, check the needed file, link or tools are given. Use when starting any non-trivial, vague or multi-part task, or when the user asks which skill fits.","needs":"Needs Python 3.8+ (standard library only). It reads skill folders and never writes, installs or runs anything.","path":"skills/generic/hub/skill-router","examples":["Which of my skills fits this request: my app keeps crashing after the last update?","Break this down and pick the right skills: analyse the logcat, then write up a bug report for the team.","Before you start, check what you need from me and which installed skills apply to this task.","I'm not sure which skill to use for this. Route it for me."],"scripts":[{"file":"route.py","path":"skills/generic/hub/skill-router/scripts/route.py","summary":"Route a user request to the right skills: split it into parts, grade each part, match installed skills.","usage":[]}]},{"name":"skill-token-meter","title":"Skill token meter: how many tokens each skill saves","category":"ai-efficiency-tools","plugins":["ai-efficiency-tools"],"area":"generic","group":"ai-efficiency","description":"Measure how many tokens a skill costs and saves, for any skill and any agent: scan every skill's token cost, estimate tokens with vs without a skill for a real task, measure exact savings from two runs or session logs, and keep one central ledger with a per-skill report. Use when the user asks how many tokens a skill saves, wants to track savings across skills, or asks which skills are worth installing.","needs":"Python 3.8+ (standard library only). Works with any agent. Token counts from files are estimates (chars/4 prose, chars/3.3 code, about +-20%); exact numbers come from usage the agent or its session logs report.","path":"skills/generic/ai-efficiency/skill-token-meter","examples":["How many tokens did the yt-lecture-overview skill save on that last task?","Track how many tokens every skill saves me in this session and show a report at the end.","Which of my installed skills cost the most tokens every session?","Compare these two session logs, one with the skill and one without, and record the savings."],"scripts":[{"file":"token_meter.py","path":"skills/generic/ai-efficiency/skill-token-meter/scripts/token_meter.py","summary":"skill-token-meter: how many tokens does a skill cost, and how many does it save? Standard library only.","usage":["report   [--ledger FILE]             totals per skill from the central ledger"]}]},{"name":"skillforge","title":"Skillforge: PDF to skills","category":"hub-tools","plugins":["hub-tools"],"area":"generic","group":"hub","description":"Turn a technical PDF (book, manual, handbook, spec) into a library of Agent Skills with the bundled offline generator (no LLM or API key). Use when the user wants to create skills from a PDF, convert a book or documentation into SKILL.md playbooks, or regenerate skills that were built from a document.","needs":"","path":"skills/generic/hub/skillforge","examples":["Turn this Kubernetes handbook PDF into Agent Skills.","Generate skills only for 'backup, restore, replication' from postgres-manual.pdf.","Show me the plan of skills skillforge would create from book.pdf before writing anything."],"scripts":[{"file":"nlp_lite.py","path":"skills/generic/hub/skillforge/scripts/nlp_lite.py","summary":"nlp_lite.py - the text statistics skillforge needs, in pure Python (standard library only).","usage":[]},{"file":"pdf_lite.py","path":"skills/generic/hub/skillforge/scripts/pdf_lite.py","summary":"pdf_lite.py - read the text of a PDF with its layout, using only the Python standard library.","usage":[]},{"file":"skillforge.py","path":"skills/generic/hub/skillforge/scripts/skillforge.py","summary":"skillforge.py - turn a technical PDF into a library of focused, AI-actionable Agent Skills,","usage":[]}]},{"name":"software-design-guardrails","title":"Software design guardrails: rules, checker, hook and CI","category":"software-design-tools","plugins":["software-design-tools"],"area":"development","group":"software-design","description":"Make AI coding agents follow good software design on every change: always-on design rules for a project's agent instruction files, a pre-commit hook and CI, and a checker that flags red flags (pass-through methods, shallow functions, swallowed errors, duplicated code, vague names, comments that repeat code) in changed lines. Use when writing, refactoring or reviewing code, or when the user wants simple, maintainable code enforced.","needs":"Needs Python 3.8+ (standard library only) for the scripts and git for --diff, --staged and the hook. Works with any agent. The checker parses Python fully and Java, Kotlin, C#, Go, JS/TS, C/C++, Rust, Swift, Dart, Scala and PHP with heuristics.","path":"skills/development/software-design/software-design-guardrails","examples":["Make sure every AI agent working in this repo follows good software design rules when it writes code.","Review my changes for design red flags before I commit: pass-through methods, swallowed errors, duplicated code.","Add a pre-commit hook and a GitHub Actions check that block new design red flags, with a baseline for old code.","Write this feature, and keep the code simple and maintainable."],"scripts":[{"file":"design_check.py","path":"skills/development/software-design/software-design-guardrails/scripts/design_check.py","summary":"Flag software-design red flags in source code.","usage":["python design_check.py [PATH ...]            scan files or folders (default: .)","python design_check.py --diff [REF]          report only lines changed since REF","(default HEAD) plus untracked files","python design_check.py --staged              report only staged lines (pre-commit)","python design_check.py --list-rules          show every rule, its red flag and fix"]},{"file":"install_guardrails.py","path":"skills/development/software-design/software-design-guardrails/scripts/install_guardrails.py","summary":"Install the software-design rules into a project so every coding agent follows them.","usage":["python install_guardrails.py status  [--project DIR]","python install_guardrails.py install [--project DIR] [--vendor DIR | --no-vendor]","[--hook] [--also FILE ...] [--yes]","python install_guardrails.py remove  [--project DIR] [--hook] [--yes]"]}]},{"name":"token-optimizer","title":"Token optimizer: read less, track usage, see it on a dashboard","category":"ai-efficiency-tools","plugins":["ai-efficiency-tools"],"area":"generic","group":"ai-efficiency","description":"Cut the tokens an agent reads and track usage: compress logs, outline or slice files, shrink JSON, pack folders under a budget, import session logs (timestamps, skills used), build an HTML dashboard. Use when the user wants to reduce tokens, read a huge log, file or JSON, or see tokens or skills used per day.","needs":"Python 3.8+ (standard library only). Works with any agent. File token counts are estimates (chars/4 prose, chars/3.3 code, about +-20%); usage imported from session logs is what the agent recorded. Importing needs an agent that writes JSON or JSONL session logs with usage records; otherwise record usage by hand.","path":"skills/generic/ai-efficiency/token-optimizer","examples":["This build log is 3 MB. Shrink it to the errors before you read it.","Show me a dashboard of how many tokens I used each day this month and which skills I used.","Give me an outline of this 2,000-line file and then only the function that handles login.","Import my agent session logs and tell me where my tokens went this week."],"scripts":[{"file":"token_dashboard.py","path":"skills/generic/ai-efficiency/token-optimizer/scripts/token_dashboard.py","summary":"Render the token-optimizer summary as one self-contained HTML page (inline SVG, CSS and a few lines of JS;","usage":[]},{"file":"token_hook.py","path":"skills/generic/ai-efficiency/token-optimizer/scripts/token_hook.py","summary":"token-optimizer hook handler: an agent's hook system runs it and passes the event as JSON on stdin.","usage":[]},{"file":"token_optimizer.py","path":"skills/generic/ai-efficiency/token-optimizer/scripts/token_optimizer.py","summary":"token-optimizer: shrink what an AI agent reads, log token usage with timestamps, and show it on a dashboard.","usage":[]}]},{"name":"uiautomator-migration","title":"UI Automator migration and audit (Kotlin and Java)","category":"uiautomator-tools","plugins":["uiautomator-tools"],"area":"testing","group":"uiautomator","description":"Migrate and audit Android UI Automator tests in Kotlin and Java: UiSelector, UiObject, UiScrollable, UiCollection and the support library to By/UiObject2 (Java) or the 2.4 uiAutomator { } DSL (Kotlin), fix 2.4 alpha names, sleeps and other flaky code. A script reports each issue with file, line and fix. Use when the user wants to upgrade, modernise, review or de-flake UI Automator tests.","needs":"The audit script needs Python 3.8+ (standard library only) and only reads files. Verifying a migration needs the Android project, Gradle and a device or emulator. Part of the uiautomator-tools bundle with uiautomator-test-authoring and uiautomator-run-debug.","path":"skills/testing/uiautomator/uiautomator-migration","examples":["Migrate our UI Automator tests from UiSelector and UiScrollable to the current API.","Audit the androidTest folder for flaky UI Automator code and deprecated calls.","We bumped uiautomator to 2.4.1 and onView { } no longer compiles. Fix our Kotlin tests.","Convert this Java test that uses UiObject and Thread.sleep to By, Until and UiObject2."],"scripts":[{"file":"uia_audit.py","path":"skills/testing/uiautomator/uiautomator-migration/scripts/uia_audit.py","summary":"Audit Android UI Automator tests (Kotlin and Java) for legacy APIs, flaky patterns and build setup.","usage":["python uia_audit.py <project-dir-or-file> [--json] [--strict] [--rules] [--only RULE_ID ...]"]}]},{"name":"uiautomator-run-debug","title":"UI Automator: run tests and debug failures","category":"uiautomator-tools","plugins":["uiautomator-tools"],"area":"testing","group":"uiautomator","description":"Run Android UI Automator tests (Kotlin or Java) with Gradle or adb am instrument, filter by class, method, annotation or shard, and explain failures from raw instrumentation output or JUnit XML: ElementNotFoundException, StaleObjectException, null UiObject2, process crashes, missing instrumentation, UiAutomation already registered. Use when UI Automator tests must be run or fail, flake or hang.","needs":"Needs Python 3.8+ (standard library only). Running tests needs adb (Android SDK Platform-Tools), the app and test APKs and a device or emulator; parsing saved output needs nothing else. Part of the uiautomator-tools bundle; uses adb-connect for connection problems and android-logcat-analyzer for crashes when installed.","path":"skills/testing/uiautomator/uiautomator-run-debug","examples":["Run only LoginTest#signIn from our UI Automator suite on the emulator and tell me why it fails.","Here's the am instrument output from CI. Which tests failed and why?","Our UI Automator tests fail with UiAutomationService already registered. What's wrong?","Shard the instrumented tests across 4 devices and summarise the JUnit results."],"scripts":[{"file":"uia_run.py","path":"skills/testing/uiautomator/uiautomator-run-debug/scripts/uia_run.py","summary":"Run Android UI Automator tests (Kotlin or Java) and explain the results.","usage":["python uia_run.py doctor [--serial S] [--adb PATH]","python uia_run.py cmd  (--runner PKG/RUNNER | --test-package PKG | --gradle MODULE) [filters]","python uia_run.py run  (--runner PKG/RUNNER | --test-package PKG) [filters] [--serial S]","[--out raw.txt] [--logcat logcat.txt] [--json] [--dry-run]","python uia_run.py parse FILE [FILE ...] [--json]","python uia_run.py results PROJECT_DIR [--json]"]}]},{"name":"uiautomator-test-authoring","title":"UI Automator test authoring (Kotlin and Java)","category":"uiautomator-tools","plugins":["uiautomator-tools"],"area":"testing","group":"uiautomator","description":"Write Android UI Automator tests in Kotlin (2.4 uiAutomator { } DSL: onElement, watchFor, waitForStable) or Java (UiDevice, By, Until, UiObject2): project setup, selectors, waits, permission dialogs, system UI, multi-window, screenshots, Compose test tags, Macrobenchmark and Baseline Profiles. A script checks the Gradle setup and generates tests and page objects. Use when the user wants UI Automator tests written or set up.","needs":"Scripts need Python 3.8+ (standard library only). The generated tests need an Android Gradle project, androidx.test.uiautomator 2.4.1 (Kotlin DSL; Java works from 2.3.0), and a device or emulator to run on. Works with the uiautomator-migration, uiautomator-run-debug and android-uiautomator-locators skills (the uiautomator-tools bundle).","path":"skills/testing/uiautomator/uiautomator-test-authoring","examples":["Set up UI Automator in our Android app and write a Kotlin test that signs in and checks the home screen.","Write a Java UI Automator test that opens Settings, turns on Do Not Disturb and checks it is on.","Generate a page object for this screen from locators/login.locators.json, in Kotlin with the new uiAutomator DSL.","Our test needs to accept the location permission dialog and then tap a notification. How do I do that with UI Automator?","Create a Macrobenchmark and a Baseline Profile generator for app startup using UI Automator."],"scripts":[{"file":"uia_scaffold.py","path":"skills/testing/uiautomator/uiautomator-test-authoring/scripts/uia_scaffold.py","summary":"Set up and scaffold Android UI Automator tests in Kotlin or Java.","usage":["python uia_scaffold.py check <project-dir> [--json]","python uia_scaffold.py deps [--dsl kts|groovy|toml]","python uia_scaffold.py new --name NAME --package PKG --app APP_PACKAGE","[--lang kotlin|java] [--kind test|page|benchmark|baseline-profile]","[--locators FILE.locators.json | --dump window_dump.xml]","[--clickable-only] [--out DIR] [--force]"]}]},{"name":"url-to-skill","title":"URL to skill: build a skill from a web page","category":"hub-tools","plugins":["hub-tools"],"area":"generic","group":"hub","description":"Turn a web page or documentation site (an http/https link) into a reusable Agent Skill with a bundled Python script that fetches the page and writes SKILL.md, references and a refreshable source record. Use when the user gives a URL and wants to make a skill from it, turn online docs, a guide or an API reference into a skill, or refresh a skill built from a web page.","needs":"Needs Python 3.8+ (standard library only) and internet access to the site. Pages that only render with JavaScript cannot be read.","path":"skills/generic/hub/url-to-skill","examples":["Create a skill from https://docs.python.org/3/library/json.html and save it for later.","Turn the docs under https://docs.example.com/cli/ into one skill called example-cli.","Refresh the skill we generated from that web page last month.","Save this internal wiki page as a skill: http://wiki.corp.local/build-guide"],"scripts":[{"file":"url_to_skill.py","path":"skills/generic/hub/url-to-skill/scripts/url_to_skill.py","summary":"Turn a web page (or a small set of pages) into a reusable Agent Skill folder.","usage":[]}]},{"name":"video-inspector","title":"Video inspector: frames, pixels and description","category":"video-tools","plugins":["video-tools"],"area":"testing","group":"tools","description":"Analyse a video file (MP4, MOV, MKV, WebM, AVI) with a ready-made Python script: metadata, frame extraction, scene changes, black or frozen sections, motion, brightness, and the colour of a pixel or area over time. Use when the user wants to analyse or describe a video or screen recording, extract frames, check for black screens, freezes or flicker, or track an LED or indicator colour.","needs":"Needs Python 3.8+ and the ffmpeg program (with ffprobe) to decode frames; no Python packages. All frame analysis is pure Python. OpenCV is used as the decoder instead when it is installed and ffmpeg is not. Metadata of MP4/MOV files (--info) needs nothing at all.","path":"skills/testing/tools/video-inspector","examples":["Analyse recording.mp4 and describe what happens in it, with a timeline.","Split demo.mp4 into frames, one every 2 seconds, and save them as PNG.","Did the screen go black or freeze anywhere in headunit_test.mp4?","Track the colour of the LED at pixel 50,900 in boot.mp4 over time.","Extract the frame at 0:12.5 from clip.mp4 and give me its pixels as CSV."],"scripts":[{"file":"mp4info.py","path":"skills/testing/tools/video-inspector/scripts/mp4info.py","summary":"Read MP4 / MOV / M4V / 3GP container metadata with the standard library only.","usage":[]},{"file":"video_frames.py","path":"skills/testing/tools/video-inspector/scripts/video_frames.py","summary":"Video frames for video_inspector.py: decoding with the ffmpeg program (no Python package needed), with","usage":[]},{"file":"video_inspector.py","path":"skills/testing/tools/video-inspector/scripts/video_inspector.py","summary":"Analyse a video (MP4, MOV, MKV, WebM, AVI, ...): metadata, frames extracted as images, per-frame colours,","usage":[]}]},{"name":"yt-lecture-overview","title":"YouTube lecture overview: link to text, slides, HLD and HTML (study and tech only)","category":"youtube-tools","plugins":["youtube-tools"],"area":"generic","group":"youtube","description":"Turn a YouTube study or tech video link into a structured HTML study page: transcript from the audio, captured slides, notes, HLD diagram and quiz. Refuses non-study videos. Use when the user shares a YouTube lecture link and wants notes, slides, an HLD, a summary or a transcript.","needs":"Python 3.8+ (standard library) for links, guardrail, captions, notes and HTML; needs internet access to youtube.com. Audio and slides need yt-dlp and ffmpeg (as programs; or the yt-dlp and av packages in --audio-python), plus one speech-to-text engine: faster-whisper, openai-whisper, vosk, or the whisper.cpp program with a model file (no pip). Node.js helps yt-dlp. Includes an optional stdio MCP server (scripts/yt_lecture_mcp.py).","path":"skills/generic/youtube/yt-lecture-overview","examples":["Give me an overview of this lecture as an HTML page: https://www.youtube.com/watch?v=aircAruvnKk","Make study notes and a transcript from this YouTube tutorial link, with a timeline and review questions.","Extract the audio from this lecture, turn the speech into text and make me an overview with the audio analysis.","Only process 10:00 to 25:00 of this 2-hour course video and summarise what that part covers.","Check whether my machine is ready to turn YouTube lecture audio into text, and tell me what to install."],"scripts":[{"file":"yt_audio.py","path":"skills/generic/youtube/yt-lecture-overview/scripts/yt_audio.py","summary":"Audio stage of yt-lecture-overview: extract a video's audio, analyse it, and turn the speech into text.","usage":[]},{"file":"yt_guardrail.py","path":"skills/generic/youtube/yt-lecture-overview/scripts/yt_guardrail.py","summary":"Guardrails for yt-lecture-overview: accept only YouTube video links, and only study/tech videos.","usage":[]},{"file":"yt_html.py","path":"skills/generic/youtube/yt-lecture-overview/scripts/yt_html.py","summary":"Render the self-contained overview.html for yt-lecture-overview. Standard library only.","usage":[]},{"file":"yt_lecture.py","path":"skills/generic/youtube/yt-lecture-overview/scripts/yt_lecture.py","summary":"yt-lecture-overview: turn a YouTube study/tech video link into text and an HTML overview.","usage":[]},{"file":"yt_lecture_mcp.py","path":"skills/generic/youtube/yt-lecture-overview/scripts/yt_lecture_mcp.py","summary":"yt-lecture MCP server: the yt-lecture-overview pipeline as MCP tools over stdio. Standard library only.","usage":[]},{"file":"yt_slides.py","path":"skills/generic/youtube/yt-lecture-overview/scripts/yt_slides.py","summary":"Slide capture for yt-lecture-overview: find the slides shown in a lecture video and save one image of each },{"title":"Information and safety","description":"Look before you change anything","options":[{"flags":"--detect","metavar":"","takes_value":false,"help":"only show which agents are installed"},{"flags":"--list","metavar":"","takes_value":false,"help":"list agents, plugins and skills"},{"flags":"--dry-run","metavar":"","takes_value":false,"help":"show what would happen, change nothing"},{"flags":"--yes, -y","metavar":"","takes_value":false,"help":"don't ask for confirmation"},{"flags":"--verbose, -v","metavar":"","takes_value":false,"help":"one line per skill instead of one per folder"},{"flags":"--version","metavar":"","takes_value":false,"help":"show the installer and hub version, then exit"}]},{"title":"Source","description":"Where the skills come from when not run from a clone","options":[{"flags":"--ref","metavar":"","takes_value":true,"help":"branch or release tag to download when not run from a clone (or $SKILLHUB_REF)"},{"flags":"--repo","metavar":"OWNER/NAME","takes_value":true,"help":"GitHub repository to download from (default: NILANJAN-01/skill-hub, or $SKILLHUB_REPO)"}]}],"mcp_server":{"name":"skill-hub-mcp","version":"0.1.0","tools":[{"name":"search_skills","title":"Search skills","description":"Ranked search over skill names, titles, descriptions and example prompts.","params":[{"name":"query","type":"string","description":"What the user wants, in plain words, e.g. 'undo last commit'","enum":[],"required":true},{"name":"category","type":"string","description":"Optional category or plugin name","enum":[],"required":false},{"name":"limit","type":"integer","description":"Maximum results (default 8)","enum":[],"required":false}],"writes":false},{"name":"route_request","title":"Route a request to skills","description":"Split a vague or multi-part request into parts and pick the skills to load for each, in order.","params":[{"name":"request","type":"string","description":"The user's whole request, in their words","enum":[],"required":true}],"writes":false}
